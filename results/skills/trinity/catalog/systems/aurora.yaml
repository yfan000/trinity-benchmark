reservations:
  genesisdemo:
    resv_id: "R8479494"
    queue: "R8479494"
    name: "genesisdemo"
    owner: "TBD"
    state: "RESV_CONFIRMED"
    start: "2026-05-11T08:00:00"
    end:   "2026-05-16T08:00:00"
    duration_hours: 120
    nodes: 0
    ncpus: 0
    ngpus: 0
    account: "datascience"
    notes: "Aurora genesisdemo reservation. Use queue=R8479494 in qsub. Refresh owner/state/start/end/nodes via `qstat -Q -f R8479494` on an Aurora login node."

scheduler:
  # Source: docs.alcf.anl.gov/aurora/running-jobs-aurora/ (2026-05-09)
  # prod is a ROUTING queue → routes to small/medium/large based on node count
  # datascience account: debug/debug-scaling confirmed; capacity confirmed (small cluster jobs)
  # small/medium/large: access denied for datascience (rc=174) — requires INCITE/ALCC allocation
  # lustre_scaling: exists but disabled (Ena=no)
  # demand: does NOT exist on Aurora
  queues:
    debug:
      min_nodes: 1
      max_nodes: 2           # 64 non-exclusive nodes shared among debug users
      min_walltime: 300
      max_walltime: 3600
      max_jobs_per_user: 1
      notes: "1 job/user limit (running+accruing+queued). Do NOT use select=1:system=aurora — invalid on Aurora PBS."
    debug-scaling:
      min_nodes: 2
      max_nodes: 256
      min_walltime: 300
      max_walltime: 3600
      max_jobs_per_user: 1
      notes: "datascience account confirmed. 1 job/user limit."
    prod:
      min_nodes: 256         # MINIMUM 256 nodes required; smaller jobs will be rejected
      max_nodes: 10624
      min_walltime: 300
      max_walltime: 86400
      routing: true          # routes to small (256-1024, 12h), medium (1025-1919, 18h), large (1920-10624, 24h)
      per_project_running_limit: 10
      per_project_queued_limit: 100
      notes: "datascience denied on small/medium/large; requires INCITE/ALCC/DD allocation."
    capacity:
      min_nodes: 1
      max_nodes: 16
      min_walltime: 300
      max_walltime: 604800   # 7 days
      max_total_nodes_across_jobs: 128
      max_jobs_per_project: 5
      notes: "Added Feb 2026. Good for small jobs that don't need prod. datascience account accessible."
    visualization:
      min_nodes: 1
      max_nodes: 32
      min_walltime: 300
      max_walltime: 28800    # 8 hours
      notes: "By request only; non-exclusive nodes."
    lustre_scaling:
      notes: "Exists but DISABLED (Ena=no). Do not use."

hardware:
  nodes: 10624
  gpus_per_node: 6
  gpu_type: "Intel Data Center GPU Max Series"
  cpus_per_node: 104
  cpu_type: "Intel Xeon CPU Max Series (Sapphire Rapids)"
  memory_per_node_gb: 512

job_defaults:
  shell: "#!/bin/bash -l"
  nodes: 1
  walltime: 600
  queue: "debug"
  account: "datascience"
  ppn: 6
  custom_attributes:
    filesystems: "home:flare"
