# ALCF Polaris — 560-node A100 GPU cluster at Argonne National Laboratory

name: "Polaris"
facility: "ALCF"
description: "560-node A100 GPU cluster at Argonne National Laboratory"

software_build_dir: "/eagle/datascience/hzheng/software"

backend: "alcf_iri"

compute:
  resource_id: "55c1c993-1124-47f9-b823-514ba3849a9a"
  api_base_url: "https://api.alcf.anl.gov/api/v1"

storage:
  eagle:
    resource_id: "1c3ad9d4-2e91-42bc-becb-72b1fde1235c"
    mount_path: "/eagle"
    remote_base_path: "/datascience/hzheng"
  home:
    resource_id: "6115bd2c-957a-4543-abff-5fae52992ff2"
    mount_path: "/home"

globus:
  eagle:
    endpoint_id: "05d2c76a-e867-4f67-aa57-76edeb0beda0"
    path_prefix: ""
  home:
    endpoint_id: "9032dd3a-e841-4687-a163-2720da731b5b"
    path_prefix: ""
  compute_endpoint_id:
    login: "2da51dde-bc07-4a4f-b288-82810ff54037"    # polaris-login
    compute: "5b36bd02-9e49-4a53-ba2e-b2798436926b"  # polaris-compute

clearml:
  queues:
    polaris: "5847e288728544fb95b354e9cdc735c9"
    polaris-login: "b8aa47eaa5524bfc909c7e278fd6bc35"
    polaris-services: "ef3d09be9a7644c9af21b16abf42e21f"
    polaris-services-executor: "96c0629ff35d4f1ca50fdfa28cb6be66"
    polaris-persistent-compute: "08a1e3771ec241df8f89e50f5dbc17e8"

reservations:
  genesisdemo:
    resv_id: "R7156017"
    queue: "R7156017"
    name: "genesisdemo"
    owner: "mluczkow"
    state: "RESV_CONFIRMED"
    account: "datascience"
    notes: "Genesis demo reservation. Use queue=R7156017 in qsub."

scheduler:
  queues:
    debug:
      min_nodes: 1
      max_nodes: 2          # 8 exclusive nodes; up to 24 total if prod nodes free
      min_walltime: 300
      max_walltime: 3600
    debug-scaling:
      min_nodes: 1
      max_nodes: 10
      min_walltime: 300
      max_walltime: 3600
      notes: "max 1 job per user (running/accruing/queued)"
    prod:
      min_nodes: 10         # MINIMUM 10 nodes required; 1-node jobs will be rejected
      max_nodes: 496
      min_walltime: 300
      max_walltime: 86400
      routing: true         # routes to small (10-24, 3h), medium (25-99, 6h), large (100-496, 24h)
      per_project_running_limit: 10
      per_project_queued_limit: 100
    demand:
      min_nodes: 1
      max_nodes: 56
      min_walltime: 300
      max_walltime: 3600
      per_project_queued_limit: 100
      notes: "by request only; preempts preemptable queue"
    preemptable:
      min_nodes: 1
      max_nodes: 10
      min_walltime: 300
      max_walltime: 259200  # 72 hours
      per_project_running_limit: 20
      notes: "jobs killed without warning when demand queue jobs arrive"
    capacity:
      min_nodes: 1
      max_nodes: 4
      min_walltime: 300
      max_walltime: 604800  # 168 hours (7 days)
      notes: "max 32 nodes across all jobs; max 2 queued+running, 1 running per user"

hardware:
  nodes: 560
  gpus_per_node: 4
  gpu_type: "A100"
  cpus_per_node: 32

job_defaults:
  shell: "#!/bin/bash -l"
  nodes: 1
  walltime: 600
  queue: "debug"
  account: "datascience"
  ppn: 4
  custom_attributes:
    filesystems: "home:eagle"
