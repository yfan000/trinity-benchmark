name: "Quantum ESPRESSO"
description: "DFT-based electronic structure code (QE 7.4, CPU build, gfortran+MPICH on Sunspot/Aurora testbed)"
category: simulation
version: "7.4"
system: sunspot

install_prefix: /home/hzheng/software/sunspot/qe
binary: /home/hzheng/software/sunspot/qe/bin/pw.x
executables:
  - pw.x
  - cp.x
  - ph.x
  - hp.x
  - pp.x

build:
  source: "https://gitlab.com/QEF/q-e/-/archive/qe-7.4/q-e-qe-7.4.tar.gz"
  method: autotools
  compiler: gfortran (gfortran 13.4, FC=gfortran MPIF90=gfortran)
  mpi: mpich (loaded via: module load frameworks; module load mpich)
  fft: DFTI (Intel MKL, from frameworks module)
  blas_lapack: MKL sequential (-lmkl_gf_lp64 -lmkl_sequential -lmkl_core)
  scalapack: disabled (--with-scalapack=no)
  build_script: /jobs/sunspot/build_qe/run.sh
  clearml_task_id: a655907ea31a40109b432d2734bb34d2
  iterations_to_success: 13

configure_flags:
  - --prefix=/home/hzheng/software/sunspot/qe
  - CC=$(mpicc path)
  - FC=gfortran
  - MPIF90=gfortran
  - --with-scalapack=no
  - --with-libmbd=no

ldflags: >
  -L<mpich>/lib -lmpifort -lmpi
  -L/opt/aurora/26.26.0/spack/unified/1.1.1/install/linux-x86_64/intel-oneapi-runtime-2025.3.1-h4uj4w3/lib
  -limf -lsvml -lirng -lintlc -lm

key_fixes:
  - description: "Real MKL DFTI include: found via find /opt/aurora -name mkl_dfti.f90"
    path: "/opt/aurora/25.190.0/oneapi/2025.2/include"
  - description: "Ghost /opt/intel/mkl/include replaced with real MKL include path in make.inc"
  - description: "libintlc.so.5 explicitly linked (-lintlc): libmpifort.so requires _intel_fast_memcpy from libintlc"
  - description: "libimf.so located at /opt/aurora/26.26.0/spack/unified/.../intel-oneapi-runtime-2025.3.1-.../lib"

modules:
  - module use /soft/modulefiles
  - module load frameworks
  - module load mpich

notes:
  - "Login node build (sunspot-services queue), no compute node needed for CPU-only build"
  - "Do NOT unset MKLROOT - configure needs it to find DFTI headers"
  - "MPIF90=gfortran overrides mpich wrapper (mpif90 wraps ifx by default) to avoid mbdlib.f90 Intel ABI issue"
  - "The build took ~100s total (incl. cp -r of source tree) on Sunspot login node"
