name: "MOOSE"
description: "Multiphysics Object-Oriented Simulation Environment - finite-element framework from INL (Polaris→Sunspot port)"
category: "simulation"
version: "master"

binary: "/home/hzheng/software/sunspot/moose/test/moose_test-opt"
install_path: "/home/hzheng/software/sunspot/moose"

modules:
  - oneapi
  - intel_compute_runtime

setup:
  - "source /opt/intel/oneapi/setvars.sh"
  - "module load intel_compute_runtime"
  - 'export I_MPI_ROOT="${ONEAPI_ROOT}/mpi/latest"'
  - "unset PYTHONPATH PYTHONHOME"
  - "export I_MPI_CC=gcc I_MPI_CXX=g++ I_MPI_F90=gfortran I_MPI_F77=gfortran"
  - "export MOOSE_DIR=/home/hzheng/software/sunspot/moose"

gpu_support: false
gpu_notes: "CPU-only build (intentional). GPU port to Intel PVC via PETSc Kokkos+SYCL backend is a future exercise; would need --with-sycl + AOT for pvc."

run_command: |
  mpiexec -n 4 --ppn 4 $MOOSE_DIR/test/moose_test-opt -i input.i

input_files: ["*.i"]

keywords: ["multiphysics", "finite element", "FEM", "nuclear", "thermal-hydraulics", "heat conduction", "diffusion", "MOOSE"]
aliases: ["moose", "moose_test", "moose-test"]

input_detection:
  extensions: [".i"]
  filenames: []
  content_markers: ["[Mesh]", "[Variables]", "[Kernels]", "[BCs]", "[Executioner]"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "workq"
  ppn: 4

scaling_notes: "Standard MPI scaling; up to 12 ranks per node (1 per PVC tile) on Sunspot, but MOOSE itself is CPU-only — pin to 4-8 ranks/node to give each process enough Sapphire Rapids cores."

required_inputs: ["*.i"]
optional_inputs: ["*.e", "*.msh"]

output_patterns: ["*.e", "*_out.e", "*.csv"]

notes: |
  Auto-ported from software/polaris/moose.yaml by the port-software skill (2026-04-30).
  Build status: SUCCESS (binary 89568 bytes at /home/hzheng/software/sunspot/moose/test/moose_test-opt).
  Smoke must run on compute node — Intel MPI cannot init on Sunspot login (any fabric).
  See knowledgebase/hpc/lessons/port_moose_polaris_to_sunspot.md for the iter-by-iter fix log
  (5 distinct bug classes resolved autonomously).

  Required runtime env (in addition to setup section):
    - mpiexec -n N (MPI must be wrapped; bare invocation hits internal_Init_thread error
      even on compute nodes if launched as bare ./moose_test-opt without mpiexec).
