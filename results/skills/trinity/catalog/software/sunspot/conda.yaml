name: "Python / Conda (frameworks)"
description: "Intel oneAPI ML stack via module load frameworks on Sunspot (Aurora test bed, Intel PVC XPU)"
category: ml-framework
version: "latest"

binary: "python"
install_path: "/soft/frameworks"

modules:
  - frameworks

setup:
  - "module load frameworks"

gpu_support: true
gpu_notes: |
  Intel Data Center GPU Max Series (Ponte Vecchio), 6 XPU tiles per node.
  Same GPU architecture as Aurora. Use torch.xpu device.

run_command: |
  python train.py                              # single tile
  mpiexec -n 6 --ppn 6 python train.py        # all 6 tiles, 1 node

input_files: [".py"]

keywords: ["python", "pytorch", "machine learning", "deep learning", "training", "neural network", "ML", "AI", "fine-tune", "LLM", "transformer", "XPU", "Intel GPU"]
aliases: ["python", "conda", "pytorch", "torch", "frameworks"]

input_detection:
  extensions: [".py"]
  filenames: ["train.py", "main.py", "run.py", "requirements.txt"]
  content_markers: ["import torch", "import tensorflow", "import numpy", "from torch"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "workq"
  account: "datascience"
  ppn: 6

scaling_notes: "6 XPU tiles per node. Use torch.xpu device. mpiexec -n 6 --ppn 6 for single-node multi-tile. workq is the main Sunspot queue (max 24h walltime, potential multi-hour scheduling delays)."

required_inputs: [".py"]
optional_inputs: [".yaml", ".json", ".pt", ".pth", ".safetensors"]

output_patterns: ["*.log", "*.pt", "*.pth", "*.safetensors", "*.csv"]

notes: |
  Sunspot is the Aurora test bed — same Intel PVC architecture, same frameworks module.

  PBS account: datascience (NOT Aurora_deployment — causes "No active allocation found").
  Intel MPI cannot init on Sunspot login nodes — MPI-using code must run on compute (workq).
  workq can have multi-hour scheduling delays; plan accordingly.

  Known limitations:
    - TorchTitan: 1 XPU tile only (FSDP2 reduce_scatter PREMUL_SUM not supported by XCCL)
    - Megatron-DS: needs ALCF-fork patches; see knowledgebase/hpc/lessons/sunspot_llm_training.md
