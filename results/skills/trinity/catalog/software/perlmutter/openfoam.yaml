name: "OpenFOAM"
description: "Open-source finite volume CFD toolbox for continuum mechanics simulations"
category: simulation
version: ""

binary: ""   # varies by solver (simpleFoam, pimpleFoam, etc.)
install_path: "/global/homes/h/hzheng/software/perlmutter/openfoam"
build_status: needs_build

modules:
  - PrgEnv-gnu
  - cray-mpich

setup:
  - "module reset"
  - "module load PrgEnv-gnu"
  - "module load cray-mpich"
  - "source /global/homes/h/hzheng/software/perlmutter/openfoam/etc/bashrc"

gpu_support: false
gpu_notes: ""

run_command: |
  srun -n 16 simpleFoam -parallel

input_files: ["system/controlDict", "system/fvSchemes", "system/fvSolution", "constant/polyMesh"]

# --- Auto-detection ---
keywords: ["OpenFOAM", "CFD", "computational fluid dynamics", "finite volume", "RANS", "LES", "turbulence", "incompressible", "multiphase"]
aliases: ["openfoam", "foam", "simpleFoam", "pimpleFoam", "rhoPimpleFoam"]

input_detection:
  extensions: []
  filenames: ["controlDict", "fvSchemes", "fvSolution", "blockMeshDict"]
  content_markers: ["FoamFile", "application", "startTime", "endTime", "deltaT"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  constraint: "cpu"
  account: "dasrepo"

scaling_notes: "CPU-only. Decompose domain with decomposePar before parallel run. Match number of subdomains to MPI ranks."

# --- Input validation ---
required_inputs: ["system/controlDict", "system/fvSchemes", "system/fvSolution"]
optional_inputs: ["system/blockMeshDict", "constant/transportProperties"]

# --- Output retrieval ---
output_patterns: ["postProcessing/**", "[0-9]*/U", "[0-9]*/p", "log.*"]

notes: "Binary path TBD — needs build. Source $FOAM_BASHRC (set automatically by setup commands). Run decomposePar before parallel execution, reconstructPar afterward."
