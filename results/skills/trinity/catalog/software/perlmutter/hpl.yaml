name: "HPL"
description: "High Performance Linpack benchmark for measuring peak floating-point performance"
category: tool
version: ""

binary: "xhpl"
install_path: "/global/homes/h/hzheng/software/perlmutter/hpl"
build_status: needs_build

modules:
  - PrgEnv-gnu
  - cray-mpich
  - cray-libsci

setup:
  - "module reset"
  - "module load PrgEnv-gnu"
  - "module load cray-mpich"
  - "module load cray-libsci"
  - "export PATH=/global/homes/h/hzheng/software/perlmutter/hpl/bin:$PATH"

gpu_support: true
gpu_notes: "GPU variant (NVIDIA HPL or hpl-cuda) uses A100 tensor cores via cuBLAS"

run_command: |
  srun -n 4 -G 4 xhpl

input_files: ["HPL.dat"]

# --- Auto-detection ---
keywords: ["HPL", "Linpack", "benchmark", "FLOPS", "TOP500", "peak performance", "matrix factorization"]
aliases: ["hpl", "linpack", "xhpl", "hplinpack"]

input_detection:
  extensions: []
  filenames: ["HPL.dat"]
  content_markers: ["HPLinpack benchmark", "Ns", "NBs", "Ps", "Qs", "PFACTs"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  constraint: "gpu"
  account: "dasrepo"

scaling_notes: "Scale N (problem size) with available memory. For A100 (40GB each), N ~ 90000-100000 per GPU. P*Q must equal total MPI ranks."

# --- Input validation ---
required_inputs: ["HPL.dat"]
optional_inputs: []

# --- Output retrieval ---
output_patterns: ["HPL.out", "*.out"]

notes: "Binary path TBD — needs build. Link against cray-libsci (BLAS/LAPACK). For GPU HPL, use NVIDIA's optimized HPL binary or build with cuBLAS. HPL.dat controls problem size (N), block size (NB), and process grid (P x Q)."
