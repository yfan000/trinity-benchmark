name: "AlphaFold"
description: "DeepMind AlphaFold2 protein structure prediction via conda environment"
category: ml-framework
version: "2"

binary: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/alphafold_venv_v3/bin/python"
install_path: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/alphafold_venv_v3"
build_status: built

modules:
  - conda

setup:
  - "module reset"
  - "module load conda"
  - "conda activate alphafold_env"

gpu_support: true
gpu_notes: "CUDA GPU required for structure prediction. Single GPU per run typical."

run_command: |
  srun -n 1 -G 1 python run_alphafold.py \
    --fasta_paths=input.fasta \
    --output_dir=./output \
    --model_preset=monomer \
    --data_dir=/global/cfs/cdirs/dasrepo/alphafold_data \
    --uniref90_database_path=/global/cfs/cdirs/dasrepo/alphafold_data/uniref90/uniref90.fasta \
    --mgnify_database_path=/global/cfs/cdirs/dasrepo/alphafold_data/mgnify/mgy_clusters_2022_05.fa \
    --template_mmcif_dir=/global/cfs/cdirs/dasrepo/alphafold_data/pdb_mmcif/mmcif_files \
    --obsolete_pdbs_path=/global/cfs/cdirs/dasrepo/alphafold_data/pdb_mmcif/obsolete.dat

input_files: [".fasta", ".fa"]

# --- Auto-detection ---
keywords: ["AlphaFold", "protein folding", "protein structure prediction", "structural biology", "FASTA", "multimer", "monomer"]
aliases: ["alphafold", "af2", "alphafold2"]

input_detection:
  extensions: [".fasta", ".fa"]
  filenames: ["run_alphafold.py"]
  content_markers: [">", "ACDEFGHIKLMNPQRSTVWY"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 7200
  queue: "debug"
  constraint: "gpu"
  account: "dasrepo"

scaling_notes: "Single GPU per prediction job. Parallelize by submitting multiple jobs with different FASTA inputs. MSA computation is CPU-intensive before GPU structure prediction."

# --- Input validation ---
required_inputs: [".fasta", ".fa"]
optional_inputs: []

# --- Output retrieval ---
output_patterns: ["output/*/ranked_*.pdb", "output/*/result_model_*.pkl", "output/*/timings.json"]

notes: "Needs build: conda create -n alphafold_env python=3.10; install JAX GPU, AlphaFold deps. Requires genetic databases (uniref90, mgnify, pdb70) in shared storage. Use --model_preset=multimer for protein complexes."
