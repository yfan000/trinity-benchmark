name: "CP2K"
description: "Quantum chemistry and solid state physics software with DBCSR GPU offload"
category: dft
version: ""

binary: ""   # fill in after build; typically cp2k.psmp
install_path: "/global/homes/h/hzheng/software/perlmutter/cp2k"
build_status: needs_build

modules:
  - PrgEnv-gnu
  - cray-mpich
  - cudatoolkit
  - cray-fftw
  - cray-hdf5
  - cray-libsci

setup:
  - "module reset"
  - "module load PrgEnv-gnu"
  - "module load cray-mpich"
  - "module load cudatoolkit"
  - "module load cray-fftw"
  - "module load cray-hdf5"
  - "module load cray-libsci"
  - "export PATH=/global/homes/h/hzheng/software/perlmutter/cp2k/bin:$PATH"

gpu_support: true
gpu_notes: "DBCSR library provides GPU-accelerated sparse matrix operations for DFT"

run_command: |
  srun -n 16 -G 4 cp2k.psmp -i input.inp

input_files: [".inp"]

# --- Auto-detection ---
keywords: ["CP2K", "DFT", "density functional theory", "AIMD", "ab initio molecular dynamics", "hybrid functional", "GPW", "GAPW"]
aliases: ["cp2k", "cp2k.psmp", "cp2k.popt"]

input_detection:
  extensions: [".inp"]
  filenames: []
  content_markers: ["&GLOBAL", "&FORCE_EVAL", "&DFT", "&SUBSYS"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  constraint: "gpu"
  account: "dasrepo"

scaling_notes: "Mix of MPI and OpenMP. Use 4 GPUs per node with multiple MPI ranks per GPU for DBCSR GPU offload. Typical: 4 MPI ranks per node x 4 GPUs."

# --- Input validation ---
required_inputs: [".inp"]
optional_inputs: [".xyz", ".pdb", "*.wfn"]

# --- Output retrieval ---
output_patterns: ["*.out", "*.restart", "*.xyz", "*.cube", "*.pdos"]

notes: "Binary path TBD — needs build. Build with DBCSR GPU support (-D__DBCSR_ACC) and libxc, libint. cp2k.psmp = MPI+OpenMP+GPU."
