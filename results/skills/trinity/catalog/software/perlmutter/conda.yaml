name: "Python / Conda"
description: "Default scientific Python stack via NERSC module, with conda environment support"
category: ml-framework
version: "2.8.0+cu129"

binary: "python3"
install_path: "/global/common/software/nersc/pytorch"

modules:
  - pytorch

setup:
  - "module reset"
  - "module load pytorch"   # PyTorch 2.8.0+cu129, CUDA 12.9

gpu_support: true
gpu_notes: "PyTorch 2.8.0 with CUDA 12.9 on A100-SXM4-80GB. Confirmed working via 'module load pytorch'."

run_command: |
  python3 train.py                         # single GPU
  srun -n 4 -G 4 --gpu-bind=single:1 python3 train.py   # 4 GPU single node

input_files: [".py"]

# --- Auto-detection ---
keywords: ["python", "pytorch", "tensorflow", "machine learning", "deep learning", "training", "neural network", "ML", "AI", "fine-tune", "LLM", "transformer", "CNN", "mnist"]
aliases: ["python", "conda", "pytorch", "tensorflow", "torch", "tf"]

input_detection:
  extensions: [".py"]
  filenames: ["train.py", "main.py", "run.py", "requirements.txt"]
  content_markers: ["import torch", "import tensorflow", "import numpy", "from torch"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  constraint: "gpu"
  account: "dasrepo"

scaling_notes: "Single GPU: srun -n 1 -G 1. Multi-GPU single node: srun -n 4 -G 4 --gpu-bind=single:1. Multi-node: srun --nodes=N -G 4*N with torch.distributed."

# --- Input validation ---
required_inputs: [".py"]
optional_inputs: [".yaml", ".json", ".pt", ".pth"]

# --- Output retrieval ---
output_patterns: ["*.log", "*.pt", "*.pth", "*.csv", "*.out"]

notes: |
  DISK QUOTA WARNING: Home filesystem (/global/homes) has a small quota (~40 GB).
  Never pip install to the default ~/.local — it will hit quota and fail.

  Preferred approach — use NERSC pre-built pytorch module (no install needed):
    module reset
    module load python
    module load pytorch   # verify exact name: module avail pytorch

  Fallback — install to scratch with --target (avoids home quota):
    PKGS=/pscratch/sd/<i>/<user>/myproject/packages
    pip install --no-cache-dir --target $PKGS torch torchvision \
        --index-url https://download.pytorch.org/whl/cu121
    PYTHONPATH=$PKGS:$PYTHONPATH python3 train.py

  Fallback — conda env on scratch (large installs, persistent):
    conda create -y --prefix /pscratch/sd/<i>/<user>/myenv \
        python=3.11 pytorch torchvision pytorch-cuda=12.1 \
        -c pytorch -c nvidia
    conda activate /pscratch/sd/<i>/<user>/myenv

  CUDA 12.x is available on GPU nodes (constraint=gpu).
  Account: dasrepo. Scratch path: /pscratch/sd/h/hzheng/
