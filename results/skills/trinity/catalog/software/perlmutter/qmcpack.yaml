name: "QMCPACK"
description: "Quantum Monte Carlo ab initio electronic structure code (CPU + CUDA GPU build on Perlmutter)"
category: simulation
version: "v4.2.0"

binary: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/qmcpack/bin/qmcpack"
install_path: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/qmcpack"
build_status: built

# Built libraries (in case downstream rebuilds need them)
deps:
  fftw: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/fftw3"
  boost: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/boost_full"

modules:
  - PrgEnv-gnu
  - cray-libsci
  - cray-hdf5-parallel
  - cmake

setup:
  - "unset PYTHONPATH PYTHONHOME LD_PRELOAD"
  - "module purge"
  - "module load PrgEnv-gnu"
  - "module load cray-libsci"
  - "module load cray-hdf5-parallel"
  - "module load cmake"
  - "export PATH=/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/qmcpack/bin:$PATH"

gpu_support: true
gpu_notes: "CUDA GPU build for A100 (sm_80). Requires cudatoolkit/12.4 + gcc-native/12.3. Mixed precision enabled."

cuda_binary: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/qmcpack_cuda/bin/qmcpack"
cuda_install_path: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/qmcpack_cuda"

run_command: |
  srun -n <ranks> qmcpack input.xml

input_files: [".xml"]

# --- Auto-detection ---
keywords: ["quantum Monte Carlo", "QMC", "diffusion Monte Carlo", "DMC", "variational Monte Carlo", "VMC", "electronic structure", "many-body"]
aliases: ["qmcpack", "qmc"]

input_detection:
  extensions: [".xml"]
  filenames: []
  content_markers: ["<simulation", "<qmcsystem", "<wavefunction", "<hamiltonian"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 3600
  qos: "debug"
  constraint: "cpu"
  account: "dasrepo"

scaling_notes: "CPU build — use all 256 cores per node. Set OMP_NUM_THREADS to a divisor of cores-per-rank for hybrid MPI+OpenMP."

# --- Input validation ---
required_inputs: [".xml"]
optional_inputs: [".h5", ".wfn"]

# --- Output retrieval ---
output_patterns: ["*.scalar.dat", "*.dmc.dat", "*.stat.h5", "qmc.s*.scalar.dat"]

build_notes: |
  CPU build: Built 2026-05-02 via jobs/perlmutter/build_qmcpack/run_v8.sh on perlmutter-services queue (13m22s).
  CUDA build: Built 2026-05-11 via jobs/perlmutter/build_qmcpack_cuda/run.sh on regular QOS (30m45s, 256 CPUs).
  CUDA flags: -DQMC_GPU=cuda -DCMAKE_CUDA_ARCHITECTURES=80 -DQMC_MIXED_PRECISION=1, gcc-native/12.3 + cudatoolkit/12.4.
  v8 winning recipe: PrgEnv-gnu + cray-libsci + cray-hdf5-parallel; bootstrap FFTW3 (no NERSC fftw module);
  bootstrap full Boost 1.84 via b2 install (cmake `find_package(Boost CONFIG)` requires BoostConfig.cmake
  which header-only install does NOT produce).
  Iteration journey: 8 versions, ~30 min total agent time. See projects/software_build/README.md
  T-new-23 (no FFTW module on NERSC) and T-new-28 (header-only Boost insufficient).
  CUDA smoke test: 2026-05-11, H2 VMC (128 walkers, 1 A100, 200 blocks×200 steps), QMCPACK execution
  completed successfully. Reference energy=-1.10218 Ha, runtime=199.7s.
  Script: jobs/perlmutter/h2_qmc/run.sh, output: /global/cfs/cdirs/dasrepo/hzheng/jobs/h2_qmc_cuda.out

notes: "Pure CPU build. cmake configure: -DCMAKE_C_COMPILER=cc -DCMAKE_CXX_COMPILER=CC -DFFTW_HOME=<bootstrap> -DBoost_DIR=<bootstrap>/lib/cmake/Boost-1.84.0 -DQMC_MPI=1 -DQMC_OMP=1 -DQMC_COMPLEX=0 -DQMC_GPU=''."
