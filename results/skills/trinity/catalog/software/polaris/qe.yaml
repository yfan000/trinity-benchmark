name: "Quantum ESPRESSO"
description: "Plane-wave DFT code for electronic structure calculations"
category: dft
version: "7.5"

binary: "/soft/applications/quantum_espresso/7.5-nvhpc24.11-libxc700/bin/pw.x"
install_path: "/soft/applications/quantum_espresso/7.5-nvhpc24.11-libxc700
modules:
  # Polaris boots with PrgEnv-nvidia (NVHPC compilers). `PrgEnv-nvhpc/8.5.0` is
  # broken on Polaris — its initdep tries to load a stand-alone "nvhpc" module
  # that no longer exists ("Lmod has detected the following error: nvhpc unknown").
  # The pre-built QE binary just needs the NVHPC 24.11 RUNTIME libraries; staying
  # under default PrgEnv-nvidia and overriding LD_LIBRARY_PATH is sufficient.
  - cray-fftw

setup:
  # DO NOT `module purge` first — it strips the Cray PE; the next
  # `module load PrgEnv-*` then fails with the same "unknown module" error.
  # Verified failure: Confab demo H2O QMC jobs 7151016/7/8 + 7151033/4/5 (2026-05-12).
  - "module load cray-fftw"
  - "export LD_LIBRARY_PATH=/soft/compilers/nvhpc/Linux_x86_64/24.11/compilers/lib:/soft/compilers/nvhpc/Linux_x86_64/24.11/math_libs/lib64:/soft/compilers/nvhpc/Linux_x86_64/24.11/cuda/lib64:$LD_LIBRARY_PATH"

gpu_support: true
gpu_notes: "Built with NVHPC 24.11 CUDA Fortran; requires LD_LIBRARY_PATH override for 24.11 runtime"

run_command: |
  PW_X=/soft/applications/quantum_espresso/7.5-nvhpc24.11-libxc700/bin/pw.x
  mpiexec -n 4 --ppn 4 --depth=8 --cpu-bind=depth \
      $PW_X -in input.scf.in 2>&1 | tee output.scf.out

input_files: [".scf.in", ".relax.in", ".bands.in"]

# --- Auto-detection ---
keywords: ["DFT", "density functional theory", "electronic structure", "SCF", "band structure", "phonon", "plane wave", "pseudopotential"]
aliases: ["qe", "quantum espresso", "quantum-espresso", "pwscf", "pw.x", "pw"]

input_detection:
  extensions: [".scf.in", ".relax.in", ".bands.in", ".pw.in"]
  filenames: []
  content_markers: ["&CONTROL", "&SYSTEM", "&ELECTRONS", "ATOMIC_SPECIES", "K_POINTS"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "4 MPI ranks per node maps to 4 GPUs. For small unit cells (<50 atoms), 1 node is sufficient. For large supercells or phonon calculations, use 2-4 nodes."

# --- Input validation ---
required_inputs: [".scf.in", ".relax.in", ".bands.in", ".pw.in"]
optional_inputs: [".UPF"]

# --- Output retrieval ---
output_patterns: ["output.*.out", "*.xml", "*.save"]

notes: |
  Pseudopotentials available at https://pseudopotentials.quantum-espresso.org/upf_files/<NAME>.UPF
  or under the QE install directory. The github repo `materialscloud-org/sssp`
  referenced in old guides is gone (every URL returns 404). For SSSP curated
  sets, use the Materials Cloud archive tarballs.

  STAGE ROUTING (revised 2026-05-12 — supersedes the May 2026 / job 7148270 lesson):
    - pw.x (SCF, NSCF=calculation='bands', relax)
        → compute queue, mpiexec -n 4 --ppn 4 (matches A100×4). Reliable.
    - bands.x / dos.x / projwfc.x / pp.x — ONE working launch on Polaris:
        ✓ compute node, BARE (no mpiexec, no srun): just `$BANDS_X -in foo.bandsx.in`.
          The cray-mpich runtime falls back to single-rank mode when no PMI
          launcher is present. Wall ≈ 2.5 min on the VO2 rutile cell, exit 0,
          all three output files (.dat, .dat.gnu, .dat.rap) produced.
          (probe: IRI job 7152374, 2026-05-12).
      Three launches that DO NOT work — record before re-trying:
        (1) polaris-services bare:        MPI_Abort(9100)  — binary is MPI-linked, no launcher
            (probe: ClearML task fd16dc8d1f6441639d2a6ac873b93d03)
        (2) polaris-services mpiexec -n 1: exit 127, "Couldn't execute /usr/sbin/palsd"
            — login nodes don't run the PBS Application Launcher daemon
            (probe: ClearML task 7de49f144f244837935b15b9c8bccaf8)
        (3) compute, mpiexec -n 1 --ppn 1: hangs past walltime (no stdout past banner)
            (probe: IRI job 7152217)
        (4) compute, mpiexec -n 4 --ppn 4: hangs in MPI_Finalize per the original
            7148270 incident (.dat files were written, but job got killed).
      Bottom line: post-processing must run on a compute node, BARE.
    - PREFERRED PATTERN: bundle post-processing into the SAME compute-node
      run.sh as pw.x. Run pw.x SCF + pw.x calculation='bands' (NSCF) +
      bands.x / dos.x / projwfc.x / pp.x sequentially in one job. Reasons:
        a. Eagle is shared, but the wfc files in tmp/<prefix>.save/ are
           large and re-reading them in a separate job adds a Globus +
           cold-cache round-trip.
        b. The PBS allocation already has the right palsd / cray-mpich
           launcher context — separate jobs re-pay the queue-wait cost
           and risk landing on a node with a slightly different env.
        c. A single 10-min compute job is still cheaper than two debug
           submissions and matches typical "small DFT cell" walltime.
      Only split into separate jobs when (i) post-processing is genuinely
      long-running (e.g. expensive projwfc with many spinors), or
      (ii) you need to iterate on the post-processing parameters without
      re-running the SCF.

  WORKDIR (all IRI submissions): every QE run.sh must self-resolve its workdir from the
  script path (`WORKDIR="$(cd "$(dirname "$0")" && pwd)"; cd "$WORKDIR"`) — IRI does NOT
  set PBS_O_WORKDIR and the script lands in $HOME, causing `open_input_file: fatal error
  opening scf.in` (exit 255). See CLAUDE.md `Job script requirements`.
