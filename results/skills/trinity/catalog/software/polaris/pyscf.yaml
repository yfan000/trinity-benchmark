name: "PySCF"
description: "Python-based Simulations of Chemistry Framework with GPU acceleration (gpu4pyscf)"
category: "quantum-chemistry"
version: "latest"

install_path: "/eagle/datascience/hzheng/software/polaris/pyscf"
venv: "/eagle/datascience/hzheng/software/polaris/pyscf/venv"
activate: "source /eagle/datascience/hzheng/software/polaris/pyscf/venv/bin/activate"

gpu_support: true
gpu_notes: "gpu4pyscf-cuda12x on A100 (sm_80). Use 'from gpu4pyscf import dft' instead of 'from pyscf import dft'."

setup:
  - "source /eagle/datascience/hzheng/software/polaris/pyscf/venv/bin/activate"

run_command: |
  python pyscf_dft.py

keywords: ["quantum chemistry", "DFT", "HF", "BFD", "ccECP", "QMC", "trial wavefunction"]
aliases: ["pyscf", "gpu4pyscf"]

notes: >
  Install: pip install gpu4pyscf-cuda12x h5py (CUDA 12, A100).
  For QMC trial wavefunctions: use BFD or ccECP via mol.ecp='bfd' / mol.basis='bfd-vtz'.
  Checkpoint output: mf.dump_chk('pyscf.chk') -> convert4qmc -pyscf pyscf.chk -hdf5.
  ClearML task: 9b4f8164588042d0a794f943eb1648b2 (install_pyscf_gpu4pyscf, polaris-services)
