name: "OpenFOAM"
description: "OpenFOAM open source CFD toolbox (CPU-only build)"
category: simulation
version: ""

binary: "/eagle/datascience/hzheng/software/crux/openfoam/bin/simpleFoam"
install_path: "/eagle/datascience/hzheng/software/crux/openfoam"

modules: []

setup:
  - "module swap PrgEnv-cray PrgEnv-gnu"
  - "module load cray-mpich"
  - "export FOAM_BASHRC=/eagle/datascience/hzheng/software/crux/openfoam/etc/bashrc"
  - "source $FOAM_BASHRC"

gpu_support: false

run_command: |
  mpiexec -n 32 --ppn 32 simpleFoam -parallel

input_files: ["system/controlDict", "system/fvSchemes", "system/fvSolution", "constant/polyMesh/"]

keywords: ["CFD", "computational fluid dynamics", "OpenFOAM", "finite volume", "turbulence"]
aliases: ["openfoam", "simpleFoam", "rhoPimpleFoam", "pimpleFoam"]

input_detection:
  extensions: []
  filenames: ["controlDict", "fvSchemes", "fvSolution"]
  content_markers: ["FoamFile", "application", "deltaT", "endTime"]

defaults:
  nodes: 1
  walltime: 3600
  queue: "workq"
  ppn: 128

scaling_notes: "CPU-only build. Decompose domain with decomposePar before running in parallel. Use decomposeParDict to set numberOfSubdomains matching MPI rank count."

required_inputs: ["system/controlDict", "system/fvSchemes", "system/fvSolution"]
optional_inputs: ["constant/polyMesh/", "0/"]
output_patterns: ["processor*/", "postProcessing/", "*.log"]

build_status: built

notes: "CPU-only build with PrgEnv-gnu (GCC 13.2) + cray-mpich on Crux. Source etc/bashrc to set OpenFOAM environment. Run decomposePar before parallel execution."
