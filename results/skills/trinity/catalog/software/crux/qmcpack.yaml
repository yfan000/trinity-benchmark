name: "QMCPACK"
description: "QMCPACK quantum Monte Carlo code (CPU-only build)"
category: simulation
version: ""

binary: "/eagle/datascience/hzheng/software/crux/qmcpack/bin/qmcpack"
install_path: "/eagle/datascience/hzheng/software/crux/qmcpack"

modules: []

setup:
  - "module swap PrgEnv-cray PrgEnv-gnu"
  - "module load cray-mpich"
  - "module load cray-hdf5"
  - "module load cray-fftw"
  - "module load cray-libsci"
  - "export PATH=/eagle/datascience/hzheng/software/crux/qmcpack/bin:$PATH"

gpu_support: false

run_command: |
  export OMP_NUM_THREADS=4
  mpiexec -n 32 --ppn 32 qmcpack input.xml

input_files: [".xml", ".h5"]

keywords: ["quantum Monte Carlo", "QMC", "QMCPACK", "electronic structure", "ab initio"]
aliases: ["qmcpack", "qmc"]

input_detection:
  extensions: [".xml"]
  filenames: []
  content_markers: ["<qmcsystem", "<project", "<particleset"]

defaults:
  nodes: 1
  walltime: 3600
  queue: "workq"
  ppn: 128

scaling_notes: "CPU-only build. Uses MPI+OpenMP. Set OMP_NUM_THREADS to control threading. On Crux: 32 MPI ranks x 4 threads = 128 cores/node."

required_inputs: [".xml"]
optional_inputs: [".h5"]
output_patterns: ["*.scalar.dat", "*.stat.h5", "*.config.h5", "qmc.*.xml"]

build_status: needs_build

notes: "CPU-only build with PrgEnv-gnu + cray-mpich + cray-hdf5 + cray-fftw + cray-libsci on Crux. Wavefunction files (.h5) generated by converter tools (pw2qmcpack.x)."
