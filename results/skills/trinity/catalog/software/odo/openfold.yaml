name: "OpenFold"
description: "AlphaFold2 PyTorch reimplementation — AMD ROCm port for Odo (MI300A)"
category: bioinformatics
version: "2.2.0"

binary: "/gpfs/wolf2/olcf/csc708/world-shared/hzheng/software/openfold/bin/python"
install_path: "/gpfs/wolf2/olcf/csc708/world-shared/hzheng/software/openfold"
build_status: installed   # 2026-05-13: SMOKE PASS via S3M reservation csc708-amsc-2 (job 40369, odo07, csc708_auser). torch 2.9.1+rocm6.4, 8x MI250X, openfold.config.model_config OK (48 evoformer blocks). Install method: pure-python copy of openfold/ source into venv site-packages (skips C++ extension build — the AlphaFold attention kernels would need ROCm clang + GCC9+; not built here). Venv has NO `bin/activate` — invoke via `<install>/bin/python`. Source clone: /gpfs/wolf2/olcf/csc708/scratch/hzheng/openfold-src (with importlib.util patch for Python 3.11+).

modules:
  - PrgEnv-amd
  - rocm
  - miniforge3

setup:
  - "module load PrgEnv-amd"
  - "module load rocm"
  - "module load miniforge3"
  - "unset PYTHONPATH PYTHONHOME"
  - "export CONDA_PKGS_DIRS=/gpfs/wolf2/olcf/csc708/scratch/hzheng/conda_pkgs"
  - "export PIP_CACHE_DIR=/gpfs/wolf2/olcf/csc708/scratch/hzheng/pip_cache"
  - "source /gpfs/wolf2/olcf/csc708/world-shared/hzheng/software/openfold/bin/activate"

gpu_support: true
gpu_notes: |
  AMD MI300A (APU with unified memory), ROCm. torch.version.hip is set.
  ROCm PyTorch installed from pytorch.org/whl/rocm6.x wheels.
  torch.cuda.is_available()=True on ROCm (AMD presents as CUDA device).

run_command: |
  python -c "
  import torch
  print('ROCm:', torch.version.hip)
  from openfold.config import model_config
  from openfold.model.model import AlphaFold
  device = 'cuda:0'
  cfg = model_config('model_1', train=False, low_prec=True)
  model = AlphaFold(cfg).to(device).eval()
  # construct batch and run model(batch)
  "

install_notes: |
  Installed via jobs/odo/build_openfold/run.sh.
  Conda env (python=3.11) at /ccsopen/proj/csc708/hzheng/software/odo/openfold.
  ROCm torch from pytorch.org whl (rocm6.4 → rocm6.3 → rocm6.2 fallback chain).
  Conda/pip caches redirected to scratch (home quota too small for torch wheels).

patches:
  config_importlib_util:
    description: "Add 'import importlib.util' after 'import importlib' in openfold/config.py"
    reason: "Python 3.12 does not auto-load importlib.util (same fix as XPU port)"

  scripts_utils_rocm_guard:
    description: "get_nvidia_cc() returns (None, None) on non-NVIDIA (ROCm guard)"
    reason: "cuInit via ctypes on libcuda.so stub fails on ROCm systems (same issue as Frontier)"

defaults:
  nodes: 1
  walltime: 3600
  queue: "batch"
  account: "CSC708"
  ppn: 1

keywords: ["OpenFold", "AlphaFold2", "protein structure", "ROCm", "AMD GPU", "MI300A", "Odo", "bioinformatics"]
aliases: ["openfold", "alphafold2", "protein-folding"]

notes: |
  Same ROCm port strategy as Frontier (MI250X) — AMD presents as CUDA, so no .cuda() redirect needed.
  Home quota on Odo is small — always redirect conda/pip cache to scratch.
  See jobs/odo/build_openfold/run.sh for the fallback ROCm wheel install chain.
