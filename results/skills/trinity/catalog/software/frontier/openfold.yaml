name: "OpenFold"
description: "AlphaFold2 PyTorch reimplementation — AMD MI250X ROCm port for Frontier (OLCF)"
category: bioinformatics
version: "2.2.0"

binary: "/ccs/proj/csc708/hzheng/software/frontier/openfold/venv/bin/python"
install_path: "/ccs/proj/csc708/hzheng/software/frontier/openfold"
build_status: built

modules:
  - PrgEnv-amd
  - rocm
  - miniforge3

setup:
  - "module load PrgEnv-amd"
  - "module load rocm"
  - "module load miniforge3"
  - "unset PYTHONPATH PYTHONHOME"
  - "export ROCR_VISIBLE_DEVICES=0,1,2,3,4,5,6,7"
  - "export HIP_VISIBLE_DEVICES=0,1,2,3,4,5,6,7"

gpu_support: true
gpu_notes: |
  AMD MI250X via ROCm. Each Frontier node has 4x MI250X = 8 GCD devices.
  PyTorch 2.9.1+rocm6.4: torch.version.hip='6.4.43484-123eb5128', torch.version.cuda=None.
  AMD GCDs appear as cuda: devices (torch.cuda.device_count()=8 on compute nodes).
  ROCR_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 required for GPU visibility on compute nodes.
  Use srun -n 1 -c 56 to launch Python scripts on compute nodes.

run_command: |
  # Must be on compute node with srun; ROCR_VISIBLE_DEVICES must be set
  srun -n 1 -c 56 python -c "
  import sys, torch
  class _Mock:
      @staticmethod
      def forward_(a, *args): a.copy_(torch.softmax(a.float(), dim=-1).to(a.dtype))
  sys.modules['attn_core_inplace_cuda'] = _Mock()
  import importlib, importlib.util
  from openfold.config import model_config
  from openfold.model.model import AlphaFold
  device = torch.device('cuda:0')
  cfg = model_config('model_1', train=False, low_prec=True)
  model = AlphaFold(cfg).to(device)
  # ... construct batch and run model(batch)
  "

smoke_command: |
  # Run via sbatch or srun on compute node
  srun -n 1 -c 56 python /ccs/proj/csc708/hzheng/software/frontier/openfold/smoke_amd.py

# --- Install details ---
install_notes: |
  Installed 2026-05-05. ClearML install task: 3681f42d66e049dea4886a035651c055
  Smoke test passed: ClearML task 6c5461a14d2b4d64abc7e56bd8e1a987, Slurm job 4530290.

  Base venv: --system-site-packages from existing vllm conda env at
    /ccs/proj/csc708/hzheng/software/frontier/vllm/vllm-env
  Inherits ROCm PyTorch 2.9.1+rocm6.4 without a 4.4 GB wheel download.

  OpenFold source: aqlaboratory/openfold commit be2ec18
  Compiler: CXX=amdclang++ (roc-6.2.4 18.0.0git) to bypass system GCC 7.5

  pip install flags: --no-build-isolation --no-deps
  Extra dependencies: biopython>=1.81, dm-tree, einops, ml-collections,
                      numpy<2, scipy, pandas, modelcif, ihm

patches:
  scripts_utils_py:
    file: "scripts/utils.py (in source clone)"
    description: "get_nvidia_cc() ROCm guard — returns (None, None) on non-NVIDIA"
    reason: "cuInit via ctypes on /usr/lib64/libcuda.so stub fails on Frontier"

  config_py:
    file: "venv/lib/python3.12/site-packages/openfold/config.py"
    description: "Add 'import importlib.util' after 'import importlib'"
    reason: "Python 3.12: bare import importlib does not auto-load util submodule"

  attention_core_py:
    file: "venv/lib/python3.12/site-packages/openfold/utils/kernel/attention_core.py"
    description: |
      Append einsum-based AttentionCore with nested try/except for bias add.
      PyTorch 2.9 is strict: t[...,N] fails on 0-d tensors and bias shape mismatches
      in chunked attention both raise RuntimeError (not silently broadcast).
      Nested try/except skips incompatible biases rather than crashing.
    reason: |
      (1) CPU fallback attn_softmax_inplace_forward_ not implemented for CUDA/ROCm tensors.
      (2) chunk_layer splits q into chunks (e.g. 8) while bias has full seq len (64);
          both direct add and transposed add fail in PyTorch 2.9.

# --- Smoke test batch construction notes ---
batch_notes: |
  Critical shape requirements vs XPU port:
  - extra_has_deletion: must use n_extra (32), NOT n_msa (16)
  - extra_deletion_value: must use n_extra (32), NOT n_msa (16)
  - add_recycling_dim: apply to ALL tensors with NO dim()>0 guard
    (PyTorch 2.9 strict: t[..., cycle_no] fails on 0-d tensors)
  - warnings.filterwarnings('ignore') to suppress non-tuple indexing DeprecationWarnings
    from triangular_multiplicative_update.py (PyTorch 2.9 deprecation, not yet an error)

# ClearML task registry
clearml_tasks:
  install_final: "3681f42d66e049dea4886a035651c055"
  smoke_passed: "6c5461a14d2b4d64abc7e56bd8e1a987"

