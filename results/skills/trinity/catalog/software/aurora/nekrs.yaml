name: "NekRS"
description: "GPU-accelerated spectral element CFD solver with OCCA/SYCL backend for Intel GPUs"
category: simulation
version: "v23"
build_status: installed

binary: "/lus/flare/projects/datascience/hzheng/software/aurora/nekrs/bin/nekrs"
install_path: "/lus/flare/projects/datascience/hzheng/software/aurora/nekrs"

modules:
  - oneapi/release
  - intel_compute_runtime
  - cmake

setup:
  - "module use /soft/modulefiles"
  - "module load oneapi/release"
  - "module load intel_compute_runtime"
  - "module load cmake"
  - "unset PYTHONPATH"
  - "export PATH=/lus/flare/projects/datascience/hzheng/software/aurora/nekrs/bin:$PATH"

gpu_support: true
gpu_notes: "Intel Data Center GPU Max Series via OCCA SYCL backend (OCCA_BACKEND=SYCL)"

run_command: |
  mpiexec -n 6 --ppn 6 nekrs --setup casename.par

defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 6

scaling_notes: "6 Intel GPU tiles per node. NekRS uses OCCA with SYCL backend for Aurora."

keywords: ["spectral element", "CFD", "fluid dynamics", "turbulence", "NekRS", "GPU", "OCCA"]
aliases: ["nekrs", "nrs"]

required_inputs: [".par", ".udf", ".oudf", ".re2", ".map"]
optional_inputs: []
output_patterns: ["*.fld", "*.log", "*.his"]

notes: |
  Built with Intel oneAPI + OCCA SYCL backend on Aurora.
  Key: OCCA_BACKEND=SYCL, use icpx with -fsycl flag.
  Build script: jobs/aurora/build_nekrs/run.sh
