name: "LAMMPS"
description: "Classical molecular dynamics with Intel GPU acceleration via Kokkos SYCL backend"
category: simulation
version: "stable_2Aug2023_update3"
build_status: built

binary: "/lus/flare/projects/datascience/hzheng/software/aurora/lammps/bin/lmp"
install_path: "/lus/flare/projects/datascience/hzheng/software/aurora/lammps"

modules:
  - oneapi/release
  - intel_compute_runtime
  - cmake

setup:
  - "module use /soft/modulefiles"
  - "module load oneapi/release"
  - "module load intel_compute_runtime"
  - "module load cmake"
  - "unset PYTHONPATH"
  - "export PATH=/lus/flare/projects/datascience/hzheng/software/aurora/lammps/bin:$PATH"

gpu_support: true
gpu_notes: "Intel Data Center GPU Max Series (Ponte Vecchio) via Kokkos SYCL backend (-k on g <ngpus> -sf kk -pk kokkos)"

run_command: |
  mpiexec -n 6 --ppn 6 lmp -in input.lammps -k on g 1 -sf kk -pk kokkos

input_files: [".lammps", ".in", ".data"]

keywords: ["molecular dynamics", "MD simulation", "classical MD", "force field", "Lennard-Jones", "materials science", "LAMMPS"]
aliases: ["lammps", "lmp", "lmp_mpi"]

input_detection:
  extensions: [".lammps", ".lmp"]
  filenames: []
  content_markers: ["units", "atom_style", "pair_style", "fix", "dump"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 6

scaling_notes: "6 Intel GPU tiles per node on Aurora. Use 1 MPI rank per tile with Kokkos SYCL (-k on g 1 -sf kk). 6 tiles per node."

required_inputs: [".lammps", ".in", ".lmp"]
optional_inputs: [".data", ".restart"]
output_patterns: ["log.lammps", "*.dump", "*.lammpstrj"]

notes: |
  Built with oneAPI + Kokkos SYCL on Aurora login node via ClearML aurora-services queue.
  Key: -DCMAKE_CXX_FLAGS="-fsycl" -DKokkos_ENABLE_SYCL=yes -DKokkos_ARCH_INTEL_PVC=yes
  Use mpicxx (MPICH wrapper), not icpx directly.
  Build script: jobs/aurora/build_lammps/run.sh
