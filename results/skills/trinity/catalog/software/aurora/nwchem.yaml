name: "NWChem"
description: "Computational chemistry software with Intel oneAPI compilers on Aurora"
category: dft
version: "7.2.2"
build_status: built

binary: "/lus/flare/projects/datascience/hzheng/software/aurora/nwchem/bin/nwchem"
install_path: "/lus/flare/projects/datascience/hzheng/software/aurora/nwchem"

modules:
  - oneapi/release

setup:
  - "module use /soft/modulefiles"
  - "module load oneapi/release"
  - "unset PYTHONPATH"
  - "export PATH=/lus/flare/projects/datascience/hzheng/software/aurora/nwchem/bin:$PATH"
  - "export NWCHEM_BASIS_LIBRARY=/lus/flare/projects/datascience/hzheng/software/aurora/nwchem/share/nwchem/libraries/"

gpu_support: false
gpu_notes: "CPU-only MPI build with Intel MKL + ScaLAPACK."

run_command: |
  mpiexec -n <nprocs> --ppn <ppn> nwchem input.nw 2>&1 | tee output.out

defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  ppn: 104

scaling_notes: "104 CPU cores per Sapphire Rapids node. NWChem scales with MPI across multiple nodes."

keywords: ["DFT", "quantum chemistry", "CCSD(T)", "electronic structure", "NWChem"]
aliases: ["nwchem", "nw"]

input_detection:
  extensions: [".nw"]
  content_markers: ["start", "geometry", "basis", "dft", "task"]

required_inputs: [".nw"]
optional_inputs: [".movecs"]
output_patterns: ["*.out", "*.db", "*.movecs"]

notes: |
  Built with Intel oneAPI (ifx/icx) + MPICH + Intel MKL on Aurora.
  Set NWCHEM_BASIS_LIBRARY to the installed basis set path.
  Build script: jobs/aurora/build_nwchem/run.sh
