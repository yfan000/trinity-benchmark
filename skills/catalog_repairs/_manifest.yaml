# Minimal repairs for catalog files that fail yaml.safe_load.
#
# WHY THIS EXISTS AND WHY IT IS NOT A COPY OF THE FILE. Two entries in the vendored catalog
# (results/skills/trinity/catalog, a cache of github.com/zhenghh04/application_catalog at
# 2026-05-13) have one-character YAML syntax errors. `app_yaml()` caught the exception and
# returned `{}`, so Quantum ESPRESSO on Polaris silently contributed nothing anywhere — its
# entry is one of the richest in the catalog, carrying the LD_LIBRARY_PATH workaround and the
# verified-failure job IDs, and the Software-selection prompt listed it as "qe — " with an
# empty description.
#
# The repair is stored as a LINE REPLACEMENT, not a re-transcription, for three reasons:
#   1. the diff below IS the patch to send upstream — nothing to translate;
#   2. re-transcribing 103 lines by hand creates a second source of truth that will drift;
#   3. `old` must match the vendored bytes exactly, so an upstream edit fails loudly instead
#      of being silently shadowed by a stale copy.
#
# The vendored cache is never modified. A re-pull stays a clean rsync, and when upstream fixes
# these the sha check trips, the repair is skipped as redundant, and `catalog.py --fill`
# reports it so the dead entry can be deleted.

repairs:

  - path: software/polaris/qe.yaml
    upstream_sha256: "224ed042bde46c46ede2500b21e469195a952548e1d23824ca13d9114a34c895"
    error: 'ParserError: unterminated double-quoted scalar; the opening quote on line 7 runs
            on until the "nvhpc" quote in the line-9 comment'
    upstream_fix: "line 7: append the missing closing double-quote to install_path"
    line: 7
    old: 'install_path: "/soft/applications/quantum_espresso/7.5-nvhpc24.11-libxc700'
    new: 'install_path: "/soft/applications/quantum_espresso/7.5-nvhpc24.11-libxc700"'

  - path: software/sunspot/qe.yaml
    upstream_sha256: "33708733ff352d31957dc1c13b8ee9fadd7345d711bbff2d959e72b51dda7d3d"
    error: "ScannerError: mapping values are not allowed here — the unquoted value contains
            ': ' in 'loaded via: module load frameworks'"
    upstream_fix: "line 20: quote the mpi value"
    line: 20
    old: "  mpi: mpich (loaded via: module load frameworks; module load mpich)"
    new: '  mpi: "mpich (loaded via: module load frameworks; module load mpich)"'
