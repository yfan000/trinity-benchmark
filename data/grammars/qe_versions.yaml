# qe input grammar, one key set PER RELEASE, with a derived removal map.
#
# WHY VERSIONED. A grammar taken from the development branch calls correct older syntax
# invented. nekRS renamed [VELOCITY] to [FLUID VELOCITY] between v23 and master and the
# catalog installs both, which is how a wrong spelling reached format_contracts.yaml.
# `removed` is DERIVED by diffing adjacent releases, never asserted by hand -- a key in
# one release and absent from the next was removed in between, and that is a fact about
# the two files rather than an opinion about the software.

