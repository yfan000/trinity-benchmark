name: "NAMD"
description: "NAMD molecular dynamics simulation (CPU-only build)"
category: simulation
version: ""

binary: "/eagle/datascience/hzheng/software/crux/namd/namd3"
install_path: "/eagle/datascience/hzheng/software/crux/namd"

modules: []

setup:
  - "module swap PrgEnv-cray PrgEnv-gnu"
  - "module load cray-mpich"
  - "export PATH=/eagle/datascience/hzheng/software/crux/namd:$PATH"

gpu_support: false

run_command: |
  mpiexec -n 128 --ppn 128 namd3 +ppn 1 input.namd

input_files: [".namd", ".conf", ".pdb", ".psf"]

keywords: ["molecular dynamics", "MD simulation", "NAMD", "biomolecular simulation"]
aliases: ["namd", "namd3", "namd2"]

input_detection:
  extensions: [".namd", ".conf"]
  filenames: []
  content_markers: ["structure", "coordinates", "outputName"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "workq"
  ppn: 128

scaling_notes: "CPU-only build. Use +ppn to control number of worker threads per MPI rank. On Crux with 128 cores/node, use mpiexec -n 128 --ppn 128 namd3 +ppn 1."

required_inputs: [".namd", ".conf"]
optional_inputs: [".pdb", ".psf", ".prm", ".coor", ".vel"]
output_patterns: ["*.log", "*.dcd", "*.coor", "*.vel", "*.xsc"]

build_status: needs_build

notes: "CPU-only build with PrgEnv-gnu (GCC 13.2) + cray-mpich on Crux. No GPU support. NAMD3 SMP build recommended for CPU-only systems."
