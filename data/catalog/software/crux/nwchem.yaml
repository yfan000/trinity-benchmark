name: "NWChem"
description: "NWChem high-performance computational chemistry package (CPU-only build)"
category: simulation
version: ""

binary: "/eagle/datascience/hzheng/software/crux/nwchem/bin/nwchem"
install_path: "/eagle/datascience/hzheng/software/crux/nwchem"

modules: []

setup:
  - "module swap PrgEnv-cray PrgEnv-gnu"
  - "module load cray-mpich"
  - "export PATH=/eagle/datascience/hzheng/software/crux/nwchem/bin:$PATH"
  - "export NWCHEM_BASIS_LIBRARY=/eagle/datascience/hzheng/software/crux/nwchem/share/basis"

gpu_support: false

run_command: |
  mpiexec -n 32 --ppn 32 nwchem input.nw

input_files: [".nw"]

keywords: ["quantum chemistry", "computational chemistry", "NWChem", "DFT", "coupled cluster", "ab initio"]
aliases: ["nwchem"]

input_detection:
  extensions: [".nw"]
  filenames: []
  content_markers: ["start", "echo", "geometry", "basis", "dft", "task"]

defaults:
  nodes: 1
  walltime: 3600
  queue: "workq"
  ppn: 128

scaling_notes: "CPU-only build. NWChem uses GA (Global Arrays) for distributed memory. Typical runs: 32-128 MPI ranks on Crux."

required_inputs: [".nw"]
optional_inputs: []
output_patterns: ["*.out", "*.movecs", "*.db"]

build_status: needs_build

notes: "CPU-only build with PrgEnv-gnu (GCC 13.2) + cray-mpich on Crux. Set NWCHEM_BASIS_LIBRARY to point to the installed basis set directory."
