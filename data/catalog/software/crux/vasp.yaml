name: "VASP"
description: "Vienna Ab initio Simulation Package (VASP) plane-wave DFT (CPU-only build, license required)"
category: dft
version: ""

binary: "/eagle/datascience/hzheng/software/crux/vasp/bin/vasp_std"
install_path: "/eagle/datascience/hzheng/software/crux/vasp"

modules: []

setup:
  - "module swap PrgEnv-cray PrgEnv-gnu"
  - "module load cray-mpich"
  - "module load cray-fftw"
  - "module load cray-libsci"
  - "export PATH=/eagle/datascience/hzheng/software/crux/vasp/bin:$PATH"

gpu_support: false

run_command: |
  mpiexec -n 16 --ppn 16 vasp_std

input_files: ["INCAR", "POSCAR", "POTCAR", "KPOINTS"]

keywords: ["DFT", "density functional theory", "VASP", "plane-wave", "ab initio", "materials science"]
aliases: ["vasp", "vasp_std", "vasp_gam", "vasp_ncl"]

input_detection:
  extensions: []
  filenames: ["INCAR", "POSCAR", "POTCAR", "KPOINTS"]
  content_markers: ["SYSTEM", "ISTART", "ICHARG", "NSW"]

defaults:
  nodes: 1
  walltime: 3600
  queue: "workq"
  ppn: 128

scaling_notes: "CPU-only build. VASP uses FFTW and ScaLAPACK (cray-libsci). KPAR and NCORE settings control parallelism. Typical runs: 16-128 MPI ranks."

required_inputs: ["INCAR", "POSCAR", "POTCAR", "KPOINTS"]
optional_inputs: ["CHGCAR", "WAVECAR"]
output_patterns: ["OUTCAR", "CONTCAR", "CHGCAR", "WAVECAR", "vasprun.xml", "DOSCAR"]

build_status: needs_build

notes: "VASP requires license. Contact ALCF support."
