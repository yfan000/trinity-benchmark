name: "NekRS"
description: "NekRS high-order spectral element CFD solver (CPU-only build)"
category: simulation
version: ""

binary: "/eagle/datascience/hzheng/software/crux/nekrs/bin/nekrs"
install_path: "/eagle/datascience/hzheng/software/crux/nekrs"

modules: []

setup:
  - "module swap PrgEnv-cray PrgEnv-gnu"
  - "module load cray-mpich"
  - "module load cray-hdf5"
  - "export PATH=/eagle/datascience/hzheng/software/crux/nekrs/bin:$PATH"
  - "export NEKRS_HOME=/eagle/datascience/hzheng/software/crux/nekrs"

gpu_support: false

run_command: |
  mpiexec -n 16 --ppn 16 nekrs --setup input.par

input_files: [".par", ".re2", ".ma2", ".udf", ".oudf"]

keywords: ["CFD", "computational fluid dynamics", "spectral element", "NekRS", "Nek"]
aliases: ["nekrs", "nek-rs"]

input_detection:
  extensions: [".par", ".re2"]
  filenames: []
  content_markers: ["[GENERAL]", "[MESH]", "[VELOCITY]"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "workq"
  ppn: 128

scaling_notes: "CPU-only build. NekRS uses occa CPU backend on Crux. Typical runs use 16-128 MPI ranks per node."

required_inputs: [".par", ".re2", ".ma2"]
optional_inputs: [".udf", ".oudf"]
output_patterns: ["*.f*", "*.nek5000", "*.log"]

build_status: needs_build

notes: "CPU-only build with PrgEnv-gnu + cray-mpich + cray-hdf5. OCCA compiled with CPU backend only. Set NEKRS_HOME to install path."
