build_status: built
name: "LAMMPS"
description: "Classical molecular dynamics with OpenMP acceleration (CPU-only, no GPU)"
category: simulation
version: "stable_2Aug2023_update3"

binary: "/eagle/datascience/hzheng/software/crux/lammps/bin/lmp"
install_path: "/eagle/datascience/hzheng/software/crux/lammps"

modules: []

setup:
  - "module swap PrgEnv-cray PrgEnv-gnu"
  - "export PATH=/eagle/datascience/hzheng/software/crux/lammps/bin:$PATH"

gpu_support: false

run_command: |
  export OMP_NUM_THREADS=16
  mpiexec -n 8 --ppn 8 lmp -in input.lammps -k on t 16 -sf kk -pk kokkos

input_files: [".lammps", ".in", ".data"]

keywords: ["molecular dynamics", "MD simulation", "classical MD", "LAMMPS"]
aliases: ["lammps", "lmp"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "workq"
  ppn: 128

scaling_notes: "CPU-only build with OpenMP. Use OMP_NUM_THREADS for thread-level parallelism. 128 cores per node on Crux."

required_inputs: [".lammps", ".in", ".lmp"]
optional_inputs: [".data", ".restart"]
output_patterns: ["log.lammps", "*.dump", "*.lammpstrj"]

notes: "Built with PrgEnv-gnu (GCC 13.2) + cray-mpich 9.0.1 on Crux. CPU-only with Kokkos OpenMP backend. Use -k on t <threads> -sf kk -pk kokkos for acceleration."
