name: "Globus Compute Endpoint Environment"
description: "Python 3.11 conda environment for running Globus Compute endpoints on Crux"
category: infrastructure

conda_env_name: "gc-py311"
python_version: "3.11"

create_commands:
  - "conda create -n gc-py311 python=3.11 -y"
  - "conda activate gc-py311"
  - "pip install globus-compute-endpoint globus-compute-sdk"

setup:
  - "conda activate gc-py311"

endpoint_start:
  - "globus-compute-endpoint stop crux-compute"
  - "globus-compute-endpoint start crux-compute"
  - "globus-compute-endpoint stop crux-user"
  - "globus-compute-endpoint start crux-user"

notes: |
  Python 3.13 causes silent WorkerLost crashes due to dill/Parsl
  incompatibility. Use Python 3.11 (matches the working Globus Compute
  tutorial endpoint). Must activate this env before starting endpoints.
