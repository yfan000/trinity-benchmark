name: "GROMACS"
description: "GROMACS molecular dynamics simulation package (CPU-only build)"
category: simulation
version: ""

binary: "/eagle/datascience/hzheng/software/crux/gromacs/bin/gmx_mpi"
install_path: "/eagle/datascience/hzheng/software/crux/gromacs"

modules: []

setup:
  - "module swap PrgEnv-cray PrgEnv-gnu"
  - "module load cray-mpich"
  - "module load cray-fftw"
  - "export PATH=/eagle/datascience/hzheng/software/crux/gromacs/bin:$PATH"

gpu_support: false

run_command: |
  export OMP_NUM_THREADS=4
  mpiexec -n 32 --ppn 32 gmx_mpi mdrun -v -deffnm md

input_files: [".tpr", ".gro", ".top", ".mdp"]

keywords: ["molecular dynamics", "MD simulation", "GROMACS", "biomolecular simulation"]
aliases: ["gromacs", "gmx", "gmx_mpi"]

input_detection:
  extensions: [".tpr", ".gro", ".mdp"]
  filenames: ["topol.tpr", "grompp.mdp"]
  content_markers: ["[ moleculetype ]", "[ system ]"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "workq"
  ppn: 128

scaling_notes: "CPU-only build. Use OMP_NUM_THREADS for thread-level parallelism alongside MPI ranks. 128 cores per node on Crux."

required_inputs: [".tpr"]
optional_inputs: [".gro", ".mdp", ".top"]
output_patterns: ["*.log", "*.edr", "*.trr", "*.xtc", "*.gro"]

build_status: needs_build

notes: "CPU-only build with PrgEnv-gnu (GCC 13.2) + cray-mpich + cray-fftw. Requires cmake and typical GROMACS dependencies. No GPU support on Crux."
