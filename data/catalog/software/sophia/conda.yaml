name: "Python / Conda"
description: "Default scientific Python stack via conda on Sophia A100 nodes"
category: ml-framework
version: ""

binary: "python"
install_path: "/soft/modulefiles/conda"

modules:
  - conda

setup:
  - "module load conda"
  - "conda activate"

gpu_support: true
gpu_notes: "CUDA 12.4, A100 GPUs. Multi-GPU via NCCL and torchrun."

run_command: |
  python train.py                         # single GPU
  torchrun --nproc_per_node=8 train.py   # multi-GPU, 1 node

input_files: [".py"]

keywords: ["python", "pytorch", "tensorflow", "machine learning", "deep learning", "training", "neural network", "ML", "AI", "fine-tune", "LLM", "transformer", "A100", "CUDA"]
aliases: ["python", "conda", "pytorch", "torch"]

input_detection:
  extensions: [".py"]
  filenames: ["train.py", "main.py", "run.py", "requirements.txt"]
  content_markers: ["import torch", "import tensorflow", "import numpy", "from torch"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "by-gpu"
  ppn: 8

scaling_notes: "Multi-GPU: torchrun --nproc_per_node=8 (or number of available GPUs). NCCL for GPU collectives."

required_inputs: [".py"]
optional_inputs: [".yaml", ".json", ".pt", ".pth", ".safetensors"]

output_patterns: ["*.log", "*.pt", "*.pth", "*.safetensors", "*.csv"]

notes: |
  Sophia: A100 GPUs, CUDA 12.4.

  Sophia system modules have unresolvable lmod dependency conflicts — use conda for all
  Python/CUDA packages rather than system modules.

  Key build environment fixes (when compiling extensions):
    CUDAHOSTCXX=/usr/bin/g++        (conda gcc 15.2 rejected by nvcc; use system g++)
    CMAKE_POLICY_VERSION_MINIMUM=3.5  (cmake 4.x compat for bundled protobuf/grpc)

  sophia-login ClearML queue is currently broken (tasks fail in <30s with cfg error).
  Use sophia compute queue with PBS hyperparams, or sophia-persistent-compute.

  See knowledgebase/hpc/lessons/sophia_pytorch_build.md for full PyTorch+MPI build recipe.
