# LAMMPS with GPU acceleration via Kokkos — Sophia (POWER9 + V100)
name: "LAMMPS (Kokkos/GPU)"
description: "LAMMPS molecular dynamics with GPU acceleration via Kokkos (V100, SM_70)"
category: "simulation"
version: ""
cuda_version: "12.4"

install_path: "/eagle/datascience/hzheng/software/sophia/lammps"
conda_env: "/eagle/datascience/hzheng/software/sophia/lammps/lammps_env"

build_status: "needs_build"

setup: |
  source /home/hzheng/clearml/miniconda3/etc/profile.d/conda.sh
  conda activate /eagle/datascience/hzheng/software/sophia/lammps/lammps_env
  export LD_LIBRARY_PATH=/usr/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}

gpu_support: true
gpu_notes: |
  CUDA 12.4, V100 (sm_70). GPU acceleration via Kokkos backend.
  Pass -k on g <N> -sf kk -pk kokkos to enable Kokkos/GPU.
  LD_LIBRARY_PATH must include /usr/lib64 (libcuda.so) and /usr/local/cuda/lib64.

build_notes: |
  Build via conda + cmake on Sophia (POWER9).
  Key steps:
  - Create conda env: conda create -n lammps_env python=3.11
  - Install build deps: conda install -c conda-forge cmake make gcc gxx
  - Install CUDA: conda install -c nvidia cuda-version=12.4 cuda-toolkit=12.4
  - Pin cuda-version=12.4 from nvidia channel (conda-forge pulls 13.x)
  - Set CUDAHOSTCXX=/usr/bin/g++ (conda gcc rejected by nvcc; system gcc 11.4 works)
  - Clone LAMMPS, build with cmake -D PKG_KOKKOS=on -D Kokkos_ARCH_VOLTA70=on
    -D Kokkos_ENABLE_CUDA=on -D CMAKE_CXX_COMPILER=<lammps>/lib/kokkos/bin/nvcc_wrapper
  - CMAKE_POLICY_VERSION_MINIMUM=3.5 may be needed for cmake 4.x compat
  Install prefix: /eagle/datascience/hzheng/software/sophia/lammps

run_command: |
  # 8-GPU single-node run with Kokkos:
  mpirun -n 8 lmp -in input.lammps -k on g 8 -sf kk -pk kokkos
  # CPU-only fallback:
  mpirun -n 32 lmp -in input.lammps

input_files:
  - "*.lammps"
  - "*.in"
  - "data.*"

keywords:
  - "molecular dynamics"
  - "MD"
  - "LAMMPS"
  - "Kokkos"
  - "force field"

aliases:
  - "lmp"
  - "lammps"

input_detection:
  extensions:
    - ".lammps"
    - ".in"
  filenames:
    - "in.lammps"
  content_markers:
    - "units"
    - "atom_style"
    - "pair_style"

defaults:
  nodes: 1
  walltime: 3600
  queue: "by-gpu"
  ppn: 8

scaling_notes: |
  Sophia has 8 V100 GPUs per node. Use -k on g 8 for full single-node GPU usage.
  For multi-node runs increase -n accordingly and set -k on g 8 per node.

required_inputs:
  - "*.lammps"
  - "*.in"

optional_inputs:
  - "data.*"
  - "*.force"

output_patterns:
  - "log.lammps"
  - "*.dump"
  - "*.restart"
  - "thermo.*"

notes: |
  Sophia uses PBS scheduler. Submit to the by-gpu queue for GPU jobs.
  No Cray environment — use conda/pip workflows throughout.
  User install base: /eagle/datascience/hzheng/software/sophia/
