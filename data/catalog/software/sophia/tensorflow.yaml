# TensorFlow via conda — Sophia (POWER9 + V100)
name: "TensorFlow"
description: "TensorFlow 2.x with CUDA 12.4 GPU support, installed via conda on Sophia"
category: "ml-framework"
version: ""
cuda_version: "12.4"

install_path: "/eagle/datascience/hzheng/software/sophia/tensorflow"
conda_env: "/eagle/datascience/hzheng/software/sophia/tensorflow/conda_env"

build_status: "needs_build"

setup: |
  source /home/hzheng/clearml/miniconda3/etc/profile.d/conda.sh
  conda activate /eagle/datascience/hzheng/software/sophia/tensorflow/conda_env
  export LD_LIBRARY_PATH=/usr/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}

gpu_support: true
gpu_notes: |
  CUDA 12.4, V100 (sm_70). TensorFlow uses CUDA for GPU acceleration.
  LD_LIBRARY_PATH must include /usr/lib64 (libcuda.so) and /usr/local/cuda/lib64.
  For distributed training use Horovod with MPI backend.

build_notes: |
  Build/install via conda on Sophia (POWER9).
  Key steps:
  - Create conda env: conda create -n tf_env python=3.11
  - Pin CUDA: conda install -c nvidia cuda-version=12.4 (conda-forge pulls 13.x)
  - Install cuDNN: conda install -c nvidia cudnn
  - Set CUDAHOSTCXX=/usr/bin/g++ if compiling any CUDA extensions (system gcc 11.4
    is accepted by nvcc; conda gcc 15 is not)
  - Install TensorFlow: pip install tensorflow[and-cuda] (or tensorflow-gpu)
  - Verify GPU: python -c "import tensorflow as tf; print(tf.config.list_physical_devices('GPU'))"
  - For Horovod distributed training:
      pip install horovod[tensorflow]  (with MPI from conda)
  Install prefix: /eagle/datascience/hzheng/software/sophia/tensorflow

run_command: |
  # Single-node GPU training:
  python train.py
  # Distributed training with Horovod (8 GPUs):
  mpirun -n 8 python train.py
  # Or with horovodrun:
  horovodrun -np 8 python train.py

input_files:
  - "*.py"
  - "*.pb"
  - "*.h5"
  - "*.keras"

keywords:
  - "deep learning"
  - "neural network"
  - "TensorFlow"
  - "Keras"
  - "Horovod"
  - "distributed training"

aliases:
  - "tf"
  - "tensorflow"
  - "keras"

input_detection:
  extensions:
    - ".py"
  filenames:
    - "train.py"
    - "model.py"
  content_markers:
    - "import tensorflow"
    - "from tensorflow"
    - "tf.keras"

defaults:
  nodes: 1
  walltime: 3600
  queue: "by-gpu"
  ppn: 8

scaling_notes: |
  Sophia has 8 V100 GPUs per node. Single-node training uses all 8 GPUs via
  Horovod+MPI or tf.distribute.MirroredStrategy.
  For multi-node runs use Horovod with mpirun across nodes.

required_inputs:
  - "*.py"

optional_inputs:
  - "*.h5"
  - "*.keras"
  - "*.pb"
  - "*.json"

output_patterns:
  - "*.h5"
  - "*.keras"
  - "saved_model/"
  - "checkpoints/"
  - "*.log"

notes: |
  Sophia uses PBS scheduler. Submit to the by-gpu queue for GPU jobs.
  No Cray environment — use conda/pip workflows throughout.
  Pin cuda-version=12.4 from the nvidia channel to avoid conda-forge pulling CUDA 13.x.
  Use CUDAHOSTCXX=/usr/bin/g++ when compiling any CUDA C++ extensions.
  User install base: /eagle/datascience/hzheng/software/sophia/
