# GROMACS with CUDA — Sophia (POWER9 + V100)
name: "GROMACS"
description: "GROMACS molecular dynamics with CUDA GPU offload (V100, SM_70) and MPI"
category: "simulation"
version: ""
cuda_version: "12.4"

install_path: "/eagle/datascience/hzheng/software/sophia/gromacs"
conda_env: "/eagle/datascience/hzheng/software/sophia/gromacs/gromacs_env"

build_status: "needs_build"

setup: |
  source /home/hzheng/clearml/miniconda3/etc/profile.d/conda.sh
  conda activate /eagle/datascience/hzheng/software/sophia/gromacs/gromacs_env
  export LD_LIBRARY_PATH=/usr/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
  export PATH=/eagle/datascience/hzheng/software/sophia/gromacs/bin:${PATH}
  source /eagle/datascience/hzheng/software/sophia/gromacs/bin/GMXRC

gpu_support: true
gpu_notes: |
  CUDA 12.4, V100 (sm_70). GPU offload for non-bonded and PME calculations.
  Use -gpu_id to assign GPUs explicitly; -ntmpi controls MPI ranks per GPU.
  LD_LIBRARY_PATH must include /usr/lib64 (libcuda.so) and /usr/local/cuda/lib64.

build_notes: |
  Build via conda + cmake on Sophia (POWER9).
  Key steps:
  - Create conda env: conda create -n gromacs_env python=3.11
  - Install build deps: conda install -c conda-forge cmake make gcc gxx openmpi
  - Install CUDA: conda install -c nvidia cuda-version=12.4 cuda-toolkit=12.4
  - Pin cuda-version=12.4 from nvidia channel (conda-forge pulls 13.x)
  - Set CUDAHOSTCXX=/usr/bin/g++ (conda gcc rejected by nvcc; system gcc 11.4 works)
  - cmake flags:
      -DGMX_GPU=CUDA
      -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda
      -DGMX_CUDA_TARGET_SM=70
      -DGMX_MPI=on
      -DGMX_BUILD_OWN_FFTW=on
      -DCMAKE_INSTALL_PREFIX=/eagle/datascience/hzheng/software/sophia/gromacs
  - CMAKE_POLICY_VERSION_MINIMUM=3.5 may be needed for cmake 4.x compat
  - make -j8 install
  Install prefix: /eagle/datascience/hzheng/software/sophia/gromacs

run_command: |
  # 8-GPU single-node run (1 MPI rank per GPU):
  mpirun -n 8 gmx_mpi mdrun -v -deffnm md -gpu_id 01234567 -ntmpi 8
  # PME offload on 1 GPU, PP on 7 GPUs:
  mpirun -n 8 gmx_mpi mdrun -v -deffnm md -gpu_id 01234567 -ntmpi 8 -pme gpu -pmefft gpu

input_files:
  - "*.tpr"
  - "*.mdp"
  - "*.gro"
  - "*.top"

keywords:
  - "molecular dynamics"
  - "MD"
  - "GROMACS"
  - "biomolecular simulation"
  - "protein"
  - "lipid bilayer"
  - "PME"

aliases:
  - "gmx"
  - "gmx_mpi"
  - "gromacs"

input_detection:
  extensions:
    - ".tpr"
    - ".mdp"
    - ".gro"
    - ".top"
    - ".itp"
  filenames:
    - "topol.tpr"
    - "md.mdp"
  content_markers:
    - "[ moleculetype ]"
    - "[ system ]"
    - "integrator"
    - "nsteps"

defaults:
  nodes: 1
  walltime: 3600
  queue: "by-gpu"
  ppn: 8

scaling_notes: |
  Sophia has 8 V100 GPUs per node. Use -ntmpi 8 -gpu_id 01234567 for full
  single-node GPU usage. For multi-node runs increase -n and set -ntmpi 8
  per node. PME offload (-pme gpu) is recommended for large systems.

required_inputs:
  - "*.tpr"

optional_inputs:
  - "*.mdp"
  - "*.gro"
  - "*.top"
  - "*.itp"
  - "*.ndx"

output_patterns:
  - "*.xtc"
  - "*.trr"
  - "*.edr"
  - "*.log"
  - "*.cpt"
  - "md.gro"

notes: |
  Sophia uses PBS scheduler. Submit to the by-gpu queue for GPU jobs.
  No Cray environment — use conda/pip workflows throughout.
  Pin cuda-version=12.4 from the nvidia channel to avoid conda-forge pulling CUDA 13.x.
  Use CUDAHOSTCXX=/usr/bin/g++ when compiling CUDA code (system gcc 11.4).
  Source GMXRC after activation to set GROMACS environment variables.
  User install base: /eagle/datascience/hzheng/software/sophia/
