name: "Quantum ESPRESSO"
description: "Plane-wave DFT code for electronic structure calculations"
category: dft
version: "7.4"

binary: "/lus/tegu/projects/PolarisAT/hzheng/software/qe/7.4/bin/pw.x"
install_path: "/lus/tegu/projects/PolarisAT/hzheng/software/qe/7.4"

modules:
  - spack-pe-base
  - cmake
  - PrgEnv-gnu
  - cray-fftw
  - craype-x86-milan

setup:
  - "module load spack-pe-base cmake"
  - "module load PrgEnv-gnu"
  - "module load cray-fftw"
  - "module load craype-x86-milan"
  - "export LD_LIBRARY_PATH=/soft/applications/conda/2025-09-25/mconda3/lib:$LD_LIBRARY_PATH"
  - "export MPICH_GPU_SUPPORT_ENABLED=0"

gpu_support: false
gpu_notes: "CPU-only build with GNU compilers. GPU support requires NVHPC rebuild."

run_command: |
  PW_X=/lus/tegu/projects/PolarisAT/hzheng/software/qe/7.4/bin/pw.x
  $PW_X -in input.scf.in 2>&1 | tee output.scf.out

input_files: [".scf.in", ".relax.in", ".bands.in"]

keywords: ["DFT", "density functional theory", "electronic structure", "SCF", "plane wave"]
aliases: ["qe", "quantum espresso", "pwscf", "pw.x"]

input_detection:
  extensions: [".scf.in", ".relax.in", ".bands.in", ".pw.in"]
  content_markers: ["&CONTROL", "&SYSTEM", "&ELECTRONS", "ATOMIC_SPECIES"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 1

scaling_notes: "Serial build on login node. For MPI runs, use MPICH_GPU_SUPPORT_ENABLED=0. MKL ScaLAPACK linked from conda — set LD_LIBRARY_PATH accordingly."

required_inputs: [".scf.in", ".relax.in", ".bands.in", ".pw.in"]
optional_inputs: [".UPF"]

output_patterns: ["output.*.out", "*.xml", "*.save"]

notes: |
  Built with PrgEnv-gnu (GCC 14.3.0) + cray-fftw + MKL from conda.
  IMPORTANT: Must set MPICH_GPU_SUPPORT_ENABLED=0 on login nodes (GTL library not available).
  Must set LD_LIBRARY_PATH to include conda MKL libs for runtime linking.
  Pseudopotentials: download from https://pseudopotentials.quantum-espresso.org/upf_files/
