name: "DeepSpeed"
description: "Microsoft DeepSpeed ZeRO optimizer for large-scale distributed model training that exceeds single-GPU memory"
category: ml-framework
version: "latest"

binary: "deepspeed"
install_path: "/lus/tegu/projects/PolarisAT/hzheng/software/pytorch"

modules:
  - conda

setup:
  - "module load conda"
  - "conda activate /lus/tegu/projects/PolarisAT/hzheng/software/pytorch/conda_env"

build_status: needs_build

gpu_support: true
gpu_notes: "Multi-GPU training via ZeRO (Zero Redundancy Optimizer) stages 1-3. ZeRO-3 partitions optimizer states, gradients, AND parameters across all 8 A100 GPUs for maximum memory efficiency."

run_command: |
  deepspeed --num_gpus=8 train.py --deepspeed ds_config.json

input_files: [".py", ".json"]

keywords: ["large model training", "ZeRO", "ZeRO-3", "DeepSpeed", "distributed training", "LLM training", "mixed precision", "optimizer offload", "model parallelism", "gradient checkpointing", "A100", "fine-tuning", "LoRA", "FSDP alternative"]
aliases: ["deepspeed", "ds", "zero", "zero3", "zero-3", "microsoft deepspeed"]

input_detection:
  extensions: [".py", ".json"]
  filenames: ["ds_config.json", "deepspeed_config.json", "zero_config.json", "train.py"]
  content_markers: ["zero_optimization", "stage", "fp16", "bf16", "gradient_accumulation_steps", "train_micro_batch_size_per_gpu", "deepspeed"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 8

scaling_notes: |
  DeepSpeed is installed as a Python package in the PyTorch conda environment.
  For multi-node training:
    deepspeed --num_nodes=<N> --num_gpus=8 --hostfile=hostfile train.py --deepspeed ds_config.json
  hostfile format: <hostname> slots=8
  ZeRO stage selection guide:
    ZeRO-1: Partition optimizer states (moderate memory savings)
    ZeRO-2: Partition optimizer states + gradients
    ZeRO-3: Partition optimizer states + gradients + parameters (maximum savings, required for 70B+)
  Offload to CPU (ZeRO-Infinity) if GPU memory is still insufficient:
    "offload_optimizer": {"device": "cpu"}
    "offload_param": {"device": "cpu"}

required_inputs: ["ds_config.json", ".py"]
optional_inputs: ["hostfile", "*.safetensors", "*.bin", "*.pt"]

output_patterns: ["checkpoints/", "global_step*/", "*.log", "zero_to_fp32.py"]

notes: |
  Install DeepSpeed into the existing PyTorch conda environment (do not create a separate env):
    conda activate /lus/tegu/projects/PolarisAT/hzheng/software/pytorch/conda_env
    pip install deepspeed
  DeepSpeed ops (fused Adam, etc.) are JIT-compiled on first use; pre-build with:
    DS_BUILD_OPS=1 pip install deepspeed
  Recommended ZeRO-3 ds_config.json skeleton:
    {
      "zero_optimization": {"stage": 3, "overlap_comm": true,
        "contiguous_gradients": true, "reduce_bucket_size": 5e8},
      "bf16": {"enabled": true},
      "train_micro_batch_size_per_gpu": 1,
      "gradient_accumulation_steps": 8
    }
  Use ZeRO-3 for models that do not fit in single A100 GPU memory (80 GB).
  For LoRA fine-tuning on Sirius: use fp32 or bf16 — fp16+CUBLAS has known instability.
  Integration: works with HuggingFace Trainer (pass deepspeed=ds_config.json),
    TRL SFTTrainer, and custom training loops via deepspeed.initialize().
  Sirius nodes: 8 x A100 80 GB; total GPU memory per node = 640 GB with ZeRO-3.
