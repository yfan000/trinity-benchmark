name: "vLLM"
description: "High-throughput LLM inference server with PagedAttention and tensor parallelism across all 8 A100 GPUs"
category: ml-framework
version: "latest"

binary: "python"
install_path: "/lus/tegu/projects/PolarisAT/hzheng/software/vllm"

modules:
  - conda

setup:
  - "module load conda"
  - "conda activate /lus/tegu/projects/PolarisAT/hzheng/software/vllm/conda_env"

build_status: needs_build

gpu_support: true
gpu_notes: "Tensor parallelism across up to 8 A100 GPUs (SM_80) via NCCL. PagedAttention reduces KV-cache fragmentation for high-throughput serving. Supports 70B+ models with TP=8."

run_command: |
  python -m vllm.entrypoints.openai.api_server \
    --model <model_path> \
    --tensor-parallel-size 8 \
    --host 0.0.0.0 \
    --port 8000

input_files: [".json", ".yaml", "*.safetensors", "*.bin"]

keywords: ["LLM inference", "large language model", "serving", "vLLM", "PagedAttention", "tensor parallelism", "OpenAI API", "A100", "inference server", "70B", "model serving", "throughput", "latency"]
aliases: ["vllm", "vllm-server", "openai-server", "llm-server", "api-server"]

input_detection:
  extensions: [".json", ".yaml"]
  filenames: ["config.json", "tokenizer_config.json", "generation_config.json"]
  content_markers: ["model_type", "architectures", "torch_dtype", "transformers_version", "tensor-parallel-size"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 8

scaling_notes: |
  Sirius is optimized for large model inference with 8 x A100 80 GB per node.
  Supported model sizes by tensor parallelism:
    TP=1: up to ~13B parameters (fits in one A100 80 GB)
    TP=2: up to ~30B parameters
    TP=4: up to ~65B parameters
    TP=8: up to ~140B+ parameters (full node, 640 GB total)
  For pipeline parallelism across multiple nodes, set --pipeline-parallel-size.
  Multi-node serving: use Ray cluster; set --ray-workers-use-nsight if profiling.

required_inputs: ["config.json", "tokenizer_config.json"]
optional_inputs: ["*.safetensors", "*.bin", "generation_config.json"]

output_patterns: ["vllm.log", "server.log"]

notes: |
  Primary use case for Sirius: large LLM inference at scale.
  Build conda environment:
    conda create -p /lus/tegu/projects/PolarisAT/hzheng/software/vllm/conda_env python=3.11
    conda activate <env>
    pip install vllm  # builds wheels with CUDA 12.x support
  cuBLAS version conflicts: if vllm crashes at startup, pin torch+vllm to matching versions.
  Known issue on Sirius: cuBLAS 12.9 may conflict — downgrade to cuBLAS 12.6 via conda.
  API is OpenAI-compatible; test with:
    curl http://localhost:8000/v1/models
    curl http://localhost:8000/v1/completions -d '{"model": "<name>", "prompt": "Hello", "max_tokens": 50}'
  Proxy note: if running behind a proxy, set --host 0.0.0.0 and use the node's hostname externally.
  Model weights should be pre-downloaded to /lus/tegu/projects/PolarisAT/hzheng/ before inference.
