name: "Unsloth"
description: "2x faster LoRA/QLoRA fine-tuning of Llama/Qwen/Mistral via fused Triton kernels (single-GPU on Sirius A100)"
category: ml-framework
version: "latest (git+main)"

binary: "python"
install_path: "/lus/tegu/projects/PolarisAT/hzheng/software/unsloth/conda_env"

modules:
  - conda

setup:
  - "module load conda"
  - "source /lus/tegu/projects/PolarisAT/hzheng/software/unsloth/conda_env/bin/activate"

build_status: needs_build
build_script: "jobs/sirius/build_unsloth/run.sh"

gpu_support: true
gpu_notes: "Single-GPU LoRA/QLoRA on A100 (SM_80). Multi-GPU via accelerate/DeepSpeed is preview-only — not used here."

run_command: |
  python finetune_unsloth.py

input_files: [".py", ".json", ".yaml", ".jsonl"]

keywords: ["LoRA", "QLoRA", "fine-tuning", "Unsloth", "PEFT", "Llama", "Qwen", "Mistral", "4-bit", "bitsandbytes", "Triton", "A100"]
aliases: ["unsloth", "qlora", "fast-lora"]

defaults:
  nodes: 1
  walltime: 1200
  queue: "sirius"
  ppn: 1

notes: |
  Built with PyTorch 2.5.1 + CUDA 12.4 + Python 3.11 on tegu.
  Sirius LoRA quirks (from CLAUDE.md):
    - cuBLAS on this driver is unhappy with fp16/bf16 + peft 0.18 stack.
    - Use dtype=torch.float32 in FastLanguageModel.from_pretrained for safety,
      OR rely on Unsloth's 4-bit quantization (load_in_4bit=True) which routes
      compute through bitsandbytes and avoids the cuBLAS path.
    - Disable mid-training eval if it triggers SDPA → cuBLAS.
  Single A100 tile (1 GPU) is sufficient and recommended for this build.
