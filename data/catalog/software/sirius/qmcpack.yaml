name: "QMCPack"
description: "Open-source production-level many-body ab initio Quantum Monte Carlo code"
category: "simulation"
version: "v4.2.0"

binary: "/lus/tegu/projects/PolarisAT/hzheng/software/qmcpack/v4.2.0/bin/qmcpack"
install_path: "/lus/tegu/projects/PolarisAT/hzheng/software/qmcpack/v4.2.0"

modules:
  - spack-pe-base
  - cmake
  - mpiwrappers/cray-mpich-llvm
  - llvm/release-19.1.7
  - cudatoolkit-standalone/12.6.3
  - craype-x86-milan
  - cray-fftw
  - cray-hdf5-parallel

setup:
  - "module load spack-pe-base cmake"
  - "module load mpiwrappers/cray-mpich-llvm llvm/release-19.1.7"
  - "module load cudatoolkit-standalone/12.6.3"
  - "module load craype-x86-milan cray-fftw cray-hdf5-parallel"
  - "export BOOST_ROOT=/soft/applications/qmcpack/boost_1_86_0"
  - "export CMAKE_PREFIX_PATH=/soft/libraries/openblas/0.3.20-omp:${CMAKE_PREFIX_PATH}"
  - "export MPICH_GPU_SUPPORT_ENABLED=0"

gpu_support: true
gpu_notes: "CUDA via OpenMP offload (sm_80 / A100), mixed-precision enabled. Built with Clang/LLVM 19.1.7."

run_command: |
  QMCPACK=/lus/tegu/projects/PolarisAT/hzheng/software/qmcpack/v4.2.0/bin/qmcpack
  $QMCPACK input.xml 2>&1 | tee qmcpack.out

input_files: [".xml"]

keywords: ["quantum monte carlo", "QMC", "VMC", "DMC", "electronic structure", "many-body"]
aliases: ["qmcpack", "qmc"]

input_detection:
  extensions: [".xml"]
  content_markers: ["<qmcsystem", "<simulationcell", "<wavefunction"]

defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  ppn: 1

scaling_notes: "1 MPI rank per GPU on compute nodes. On login nodes, use serial (1 process) with MPICH_GPU_SUPPORT_ENABLED=0."

required_inputs: ["input.xml"]
optional_inputs: []

output_patterns: ["*.scalar.dat", "*.stat.h5", "*.opt.xml"]

notes: |
  GPU real mixed-precision build with Clang/LLVM 19.1.7 + OpenMP offload (sm_80).
  Uses OpenBLAS (not MKL) to avoid conda MKL header conflicts.
  IMPORTANT: Must load llvm/release-19.1.7 module for runtime (libomptarget.so.19.1).
  IMPORTANT: Must set MPICH_GPU_SUPPORT_ENABLED=0 on login nodes.
  Dependencies built from source: libxml2 at /lus/tegu/projects/PolarisAT/hzheng/software_builds/deps/libxml2-install
  Wavefunction converter: convertpw4qmc (reads QE save directory, outputs ESHDF HDF5)
  QMCPACK pseudopotentials (XML format): C.ccECP.xml available in source tree tests/pseudopotentials_for_tests/
