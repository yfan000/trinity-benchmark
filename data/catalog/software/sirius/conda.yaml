name: "Python / Conda"
description: "Default scientific Python stack via conda on Sirius A100 nodes"
category: ml-framework
version: ""

binary: "python"
install_path: "/soft/modulefiles/conda"

modules:
  - conda

setup:
  - "module load conda"
  - "conda activate"

gpu_support: true
gpu_notes: "CUDA 12.8 driver, 4× A100-SXM4-40GB per node. Use NCCL for GPU collective ops."

run_command: |
  python train.py                        # single GPU
  torchrun --nproc_per_node=4 train.py  # all 4 A100s, 1 node

input_files: [".py"]

keywords: ["python", "pytorch", "tensorflow", "machine learning", "deep learning", "training", "neural network", "ML", "AI", "fine-tune", "LLM", "transformer", "A100", "CUDA"]
aliases: ["python", "conda", "pytorch", "torch"]

input_detection:
  extensions: [".py"]
  filenames: ["train.py", "main.py", "run.py", "requirements.txt"]
  content_markers: ["import torch", "import tensorflow", "import numpy", "from torch"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "4 A100 GPUs per node. Single GPU: python train.py. Multi-GPU: torchrun --nproc_per_node=4. Multi-node: torchrun --nproc_per_node=4 --nnodes=N --master_addr=$MASTER_ADDR."

required_inputs: [".py"]
optional_inputs: [".yaml", ".json", ".pt", ".pth", ".safetensors"]

output_patterns: ["*.log", "*.pt", "*.pth", "*.safetensors", "*.csv"]

notes: |
  Sirius: 4× A100-SXM4-40GB GPUs, CUDA 12.8 driver.

  Known cuBLAS issue — purge cuda-12.9 from LD_LIBRARY_PATH before any CUDA op:
    export LD_LIBRARY_PATH=$(echo $LD_LIBRARY_PATH | tr ':' '\n' | grep -v 'cuda-12.9' | tr '\n' ':')

  LoRA / fine-tuning caveats:
    - fp16/bf16 LoRA triggers CUBLAS_STATUS_INVALID_VALUE (peft 0.18 + torch + CUDA 12.8) — use fp32
    - Disable mid-training eval (SDPA also hits cuBLAS)
    - Multi-GPU LoRA: use DeepSpeed ZeRO-3 (DDP fp32 OOMs on 7B models)

  See knowledgebase/hpc/lessons/sirius_vllm.md for vLLM deployment lessons.
