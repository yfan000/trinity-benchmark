name: "DeepSpeed"
description: "Microsoft distributed training library for large-scale deep learning with ZeRO optimizer"
category: ml-framework
version: ""

binary: "deepspeed"
install_path: ""   # pip install into existing pytorch env
build_status: needs_build

modules:
  - pytorch/2.3.1

setup:
  - "module reset"
  - "module load pytorch/2.3.1"
  - "source /global/homes/h/hzheng/software/perlmutter/vllm/venv/bin/activate"
  # If using a dedicated DeepSpeed env:
  # "source /global/homes/h/hzheng/software/perlmutter/deepspeed/venv/bin/activate"

gpu_support: true
gpu_notes: "CUDA GPU required. ZeRO-1/2/3 optimizer sharding across GPUs and nodes via NCCL."

run_command: |
  srun -n 4 -G 4 deepspeed --num_gpus=4 train.py --deepspeed ds_config.json

input_files: [".py", ".json"]

# --- Auto-detection ---
keywords: ["DeepSpeed", "ZeRO", "ZeRO-3", "distributed training", "model parallelism", "large model training", "FSDP alternative", "mixed precision"]
aliases: ["deepspeed", "ds", "zero"]

input_detection:
  extensions: [".py", ".json"]
  filenames: ["ds_config.json", "deepspeed_config.json"]
  content_markers: ["import deepspeed", "from deepspeed", "zero_optimization", "train_micro_batch_size_per_gpu"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  constraint: "gpu"
  account: "dasrepo"

scaling_notes: "4 A100 GPUs per node. ZeRO-3 recommended for large models. Multi-node: use srun with --nodes and set MASTER_ADDR/MASTER_PORT."

# --- Input validation ---
required_inputs: [".py"]
optional_inputs: ["ds_config.json", "deepspeed_config.json"]

# --- Output retrieval ---
output_patterns: ["*.pt", "*.ckpt", "checkpoint_*", "global_step*/", "logs/**"]

notes: "Needs build: pip install deepspeed into an active pytorch venv. Requires ds_config.json for ZeRO configuration. Set --deepspeed ds_config.json in training args."
