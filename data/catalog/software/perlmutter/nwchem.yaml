name: "NWChem"
description: "High-performance computational chemistry code for molecular and periodic systems"
category: dft
version: ""

binary: ""   # fill in after build
install_path: "/global/homes/h/hzheng/software/perlmutter/nwchem"
build_status: needs_build

modules:
  - PrgEnv-gnu
  - cray-mpich
  - cray-hdf5

setup:
  - "module reset"
  - "module load PrgEnv-gnu"
  - "module load cray-mpich"
  - "module load cray-hdf5"
  - "export PATH=/global/homes/h/hzheng/software/perlmutter/nwchem/bin:$PATH"
  - "export NWCHEM_BASIS_LIBRARY=/global/homes/h/hzheng/software/perlmutter/nwchem/share/basis/"

gpu_support: false
gpu_notes: ""

run_command: |
  srun -n 16 nwchem input.nw

input_files: [".nw"]

# --- Auto-detection ---
keywords: ["NWChem", "quantum chemistry", "coupled cluster", "CCSD", "TDDFT", "molecular dynamics", "plane wave DFT"]
aliases: ["nwchem", "nwchem7"]

input_detection:
  extensions: [".nw"]
  filenames: []
  content_markers: ["start", "geometry", "basis", "task", "scf", "dft", "mp2", "ccsd"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  constraint: "cpu"
  account: "dasrepo"

scaling_notes: "CPU-only. Scales to hundreds of MPI ranks for large systems. Memory-intensive; allocate adequate memory per rank."

# --- Input validation ---
required_inputs: [".nw"]
optional_inputs: [".xyz", "*.db"]

# --- Output retrieval ---
output_patterns: ["*.out", "*.movecs", "*.cube", "*.db"]

notes: "Binary path TBD — needs build. Set NWCHEM_BASIS_LIBRARY to the NWChem basis set directory. HDF5 needed for some I/O features."
