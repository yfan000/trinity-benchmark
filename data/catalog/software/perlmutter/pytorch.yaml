name: "PyTorch"
description: "Deep learning framework with CUDA+NCCL GPU support via NERSC system module"
category: ml-framework
version: "2.3.1"

binary: "python"
install_path: ""   # system module; no user install path needed
build_status: installed

modules:
  - pytorch/2.3.1

setup:
  - "module reset"
  - "module load pytorch/2.3.1"

gpu_support: true
gpu_notes: "CUDA + NCCL multi-GPU support. Use torchrun or srun for distributed training."

run_command: |
  # Single-node distributed (recommended):
  srun -n 4 -G 4 --gpu-bind=single:1 python train.py
  # Or with torchrun:
  torchrun --nproc_per_node=4 train.py

input_files: [".py"]

# --- Auto-detection ---
keywords: ["PyTorch", "deep learning", "neural network", "training", "inference", "GPU training", "distributed training", "NCCL", "DDP", "FSDP"]
aliases: ["pytorch", "torch", "torchrun"]

input_detection:
  extensions: [".py"]
  filenames: []
  content_markers: ["import torch", "from torch", "torch.nn", "torch.cuda", "torch.distributed"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  constraint: "gpu"
  account: "dasrepo"

scaling_notes: "4 A100 GPUs per node. Use DDP or FSDP for multi-GPU; srun for multi-node. NCCL backend for GPU collectives."

# --- Input validation ---
required_inputs: [".py"]
optional_inputs: [".yaml", ".json", ".pt", ".pth"]

# --- Output retrieval ---
output_patterns: ["*.pt", "*.pth", "*.ckpt", "checkpoint_*", "runs/**"]

notes: "NERSC system module; no build required. Check available versions with: module spider pytorch. NCCL and cuDNN included in the module."
