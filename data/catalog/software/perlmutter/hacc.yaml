name: "HACC"
description: "Hardware/Hybrid Accelerated Cosmology Code for N-body cosmological simulations"
category: simulation
version: ""

binary: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/hacc/bin/driver_short-range"
install_path: "/global/cfs/cdirs/dasrepo/hzheng/software/perlmutter/hacc"
build_status: built

build_notes: |
  Built 2026-05-03. Kokkos 3.7.02 + Cabana 0.6.1 + HACCabana from source.
  Required Kokkos_ENABLE_CUDA_LAMBDA=ON (Cabana 0.6.1 requires it).
  HACCabana cmake needed CMAKE_PROJECT_INCLUDE_BEFORE stub to pre-create
  CUDA::cudart_static_deps / CUDA::cuda_driver / CUDA::cudart INTERFACE targets,
  because HACCabana is CXX-only but KokkosConfig.cmake (built with NVHPC CUDA 12.9)
  calls SET_TARGET_PROPERTIES on CUDA::cudart in the generate step.
  Build dir: /pscratch/sd/h/hzheng/build_hacc_perlmutter_v2
  ClearML task: a82fb736cc984ed0983e019b040bc7e8 (build_hacc_perlmutter_v10)

modules:
  - PrgEnv-gnu
  - cudatoolkit
  - cmake

setup:
  - "module reset"
  - "module load PrgEnv-gnu"
  - "module load cray-mpich"
  - "module load cudatoolkit"
  - "export PATH=/global/homes/h/hzheng/software/perlmutter/hacc/bin:$PATH"

gpu_support: true
gpu_notes: "CUDA GPU acceleration for N-body force calculations"

run_command: |
  srun -n 4 -G 4 hacc input.params

input_files: [".params", ".pk"]

# --- Auto-detection ---
keywords: ["cosmology", "N-body", "dark matter", "large scale structure", "particle simulation", "cosmological simulation"]
aliases: ["hacc", "hacc-tp", "hacctp"]

input_detection:
  extensions: [".params"]
  filenames: []
  content_markers: ["STEPS", "SWAP_STEPS", "OUTPUT_STEPS", "NUM_PARTICLES"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  constraint: "gpu"
  account: "dasrepo"

scaling_notes: "Designed for strong and weak scaling. 1 GPU per MPI rank typical. Can run multi-node with many ranks."

# --- Input validation ---
required_inputs: [".params"]
optional_inputs: [".pk", ".init"]

# --- Output retrieval ---
output_patterns: ["*.pk", "*.halo", "*.gio", "*.fofproperties"]

notes: "Binary path TBD — needs build from source. HACC source is available via DOE repositories."
