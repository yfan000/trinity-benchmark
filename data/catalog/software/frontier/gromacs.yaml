---
# GPU-enabled GROMACS build (OpenCL via AMD ROCm)
app: gromacs
version: "2024.4"
system: frontier
variant: gpu_opencl
status: installed
install_prefix: /ccs/proj/csc708/hzheng/software/frontier/gromacs_hip
build_dir: /ccs/proj/csc708/hzheng/build_gromacs_hip/gromacs-2024.4
built_date: "2026-05-05"

modules:
  - PrgEnv-gnu    # gcc + cray cc/CC wrappers + cmake
  - rocm/6.2.4    # AMD ROCm 6.2.4 OpenCL runtime

compilers:
  CC: cc           # Cray wrapper (GCC 13.3.1)
  CXX: CC          # Cray wrapper (GCC 13.3.1)

cmake_flags:
  GMX_GPU: "OpenCL"
  OpenCL_LIBRARY: "/opt/rocm-6.2.4/lib/libOpenCL.so"
  OpenCL_INCLUDE_DIR: "/opt/rocm-6.2.4/include"
  GMX_GPU_NB_CLUSTER_SIZE: "8"   # CRITICAL: 64 causes runtime kernel compile failure ("unsupported CL_SIZE")
  GMX_MPI: "ON"
  GMX_OPENMP: "ON"
  GMX_BUILD_OWN_FFTW: "ON"
  GMX_DOUBLE: "OFF"
  GMX_SIMD: AVX2_256
  CMAKE_BUILD_TYPE: Release
  REGRESSIONTEST_DOWNLOAD: "OFF"

binaries:
  - bin/gmx_mpi

gpu_binary: "/ccs/proj/csc708/hzheng/software/frontier/gromacs_hip/bin/gmx_mpi"
gpu_install_prefix: "/ccs/proj/csc708/hzheng/software/frontier/gromacs_hip"
gpu_build_status: installed
gpu_built_date: "2026-05-05"
gpu_backend: OpenCL
gpu_performance: "213.5 ns/day (1 GCD, 7k TIP3P atoms); 2.3× over CPU-only"

gpu_run_command: |
  srun -n 1 gmx_mpi mdrun -deffnm sim -nb gpu -pme gpu

gmx_version_output: |
  GROMACS version:     2024.4
  GPU support:         OpenCL
  NBNxM GPU setup:     super-cluster 2x2x2 / cluster 8
  GPU FFT library:     clFFT
  MPI library:         CRAY MPICH version 8.1.31.9
  SIMD instructions:   AVX2_256

notes: |
  - GMX_GPU=HIP does NOT exist in official GROMACS tarballs (2022-2024).
    Built with OpenCL via ROCm 6.2.4. GMX_GPU_NB_CLUSTER_SIZE=8 is critical
    (64 causes runtime kernel compile failure: "unsupported CL_SIZE").
  - OpenCL multi-GPU limited: all PP ranks route to GPU 0 regardless of --gpus-per-task.
    True multi-GCD requires HIP backend from OLCF-patched source (not available as module).
  - GMX_GPU=HIP is NOT valid in official GROMACS tarballs (2022-2024); only OFF/CUDA/OpenCL/SYCL.
  - SYCL requires Intel DPC++ (fsycl-targets) or AdaptiveCpp — neither available on Frontier.
  - OpenCL via AMD ROCm 6.2.4 works but is marked deprecated in GROMACS 2024 (still fully functional).
  - MUST use -DOpenCL_LIBRARY and -DOpenCL_INCLUDE_DIR (not -DOPENCL_LIBRARIES) to override cmake's
    auto-detection which picks /usr/lib64/libOpenCL.so (old system stub) instead of ROCm's.
  - ClearML task: 9b1bad782583435c80a693341d4c13c2 (build_gromacs_hip_frontier_v7)
  - Build duration: ~4 minutes with make -j 16 on login node
