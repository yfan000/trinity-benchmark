name: "vLLM (ROCm)"
description: "vLLM ROCm inference on Odo AMD MI250X/MI210. Validated 2026-05-11: 86 tok/s (c=1) and 614 tok/s (c=4) on single MI210 GCD using vllm==0.8.5+rocm. Build from source required — no PyPI ROCm wheels."
category: ml-framework
version: "0.8.5+rocm (working) / 0.9.2rc2+rocm624 (also installed)"

binary: "/gpfs/wolf2/olcf/csc708/scratch/hzheng/vllm-rocm-odo/bin/python"
install_path: "/gpfs/wolf2/olcf/csc708/scratch/hzheng/vllm-rocm-odo"
build_status: built
rocm_path: "/opt/rocm-6.2.4"   # Odo has ROCm 6.2.4 (not 6.1.3 as older notes say)

# ── MANDATORY ENV VARS ─────────────────────────────────────────────────────

setup:
  - "export ROCM_PATH=/opt/rocm-6.2.4"
  - "export PATH=$ROCM_PATH/bin:$ROCM_PATH/hip/bin:$PATH"
  - "export LD_LIBRARY_PATH=$ROCM_PATH/lib:$ROCM_PATH/lib64:$ROCM_PATH/hip/lib:$LD_LIBRARY_PATH"
  - "export PYTHONPATH=$ROCM_PATH/share/amd_smi:$PYTHONPATH  # platform detection"
  - "export HIP_VISIBLE_DEVICES=0  # or 0,1,...,7 for all GCDs"
  - "export CUDA_VISIBLE_DEVICES=0  # must match HIP_VISIBLE_DEVICES exactly"
  - "unset ROCR_VISIBLE_DEVICES     # causes Ray conflict if set"
  - "unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY"
  - "export VLLM_TARGET_DEVICE=rocm"
  - "export TORCHDYNAMO_DISABLE=1   # avoid triton/inductor issues"
  - "export TORCH_COMPILE_DISABLE=1"
  - "source /gpfs/wolf2/olcf/csc708/scratch/hzheng/vllm-rocm-odo/bin/activate"

gpu_notes: |
  AMD MI250X/MI210 via ROCm 6.2.4. Each Odo node has 4x MI250X = 8 GCD devices.
  Login node (login1) also has GPU access — vLLM works directly on login node.
  torch.cuda.is_available() = True. Backend: ROCmFlashAttention.

  VALIDATED 2026-05-11 (ClearML task 9f040056):
  - vllm==0.8.5+rocm, single MI210 GCD (HIP_VISIBLE_DEVICES=0)
  - enforce_eager=True, max_model_len=131072 (auto), gpu_memory_utilization=0.85
  - LLaMA-3.1-8B: 86.4 tok/s @ concurrency=1, 613.5 tok/s @ concurrency=4
  - Model load: 68.98s (KV cache profile takes ~68s for 131072 ctx)
  - KV cache: 24.95 GiB → 12,773 blocks

# ── CRITICAL: if __name__ == '__main__' GUARD ──────────────────────────────

mainguard_note: |
  REQUIRED: All Python scripts calling vllm.LLM() MUST use:
    if __name__ == '__main__':
        llm = LLM(...)

  Without this, vLLM's multiprocessing.spawn start method will re-execute
  the script's top-level code in worker processes, causing:
    RuntimeError: An attempt has been made to start a new process before
    the current process has finished its bootstrapping phase.

  Also: script MUST be a .py file (not python - <<'EOF' stdin). Worker
  processes cannot re-read from stdin.

# ── RUN COMMAND ────────────────────────────────────────────────────────────

run_command: |
  # Write to a .py file first, then run python /path/to/file.py
  if __name__ == '__main__':
      from vllm import LLM, SamplingParams
      llm = LLM(
          model="/gpfs/wolf2/olcf/csc708/scratch/hzheng/models/llama-3.1-8b",
          dtype="bfloat16",
          tensor_parallel_size=1,   # single GCD; use 8 for full node
          enforce_eager=True,
          gpu_memory_utilization=0.85,
      )
      outputs = llm.generate(["Hello, HPC!"], SamplingParams(max_tokens=64))
      print(outputs[0].outputs[0].text)

# ── CLEARML SUBMISSION ─────────────────────────────────────────────────────

clearml_queue: "odo-services"   # runs on login1 which has GPU access
# S3M batch execution (csc708_auser) is blocked by seccomp — use ClearML instead

clearml_template: |
  mcp__clearml-amsc__clearml_submit_task(
      name="vllm-inference-odo",
      project_id="<project_id>",
      queue_name="odo-services",
      script_content="""
  #!/bin/bash
  export ROCM_PATH=/opt/rocm-6.2.4
  export PATH=$ROCM_PATH/bin:$PATH
  export LD_LIBRARY_PATH=$ROCM_PATH/lib:$ROCM_PATH/lib64:$LD_LIBRARY_PATH
  export PYTHONPATH=$ROCM_PATH/share/amd_smi:$PYTHONPATH
  export HIP_VISIBLE_DEVICES=0
  export CUDA_VISIBLE_DEVICES=0
  unset ROCR_VISIBLE_DEVICES
  unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY
  export VLLM_TARGET_DEVICE=rocm
  export TORCHDYNAMO_DISABLE=1 TORCH_COMPILE_DISABLE=1
  source /gpfs/wolf2/olcf/csc708/scratch/hzheng/vllm-rocm-odo/bin/activate

  WORKDIR=/gpfs/wolf2/olcf/csc708/scratch/hzheng/jobs/odo/inference
  mkdir -p $WORKDIR
  cat > $WORKDIR/bench.py << 'PYEOF'
  if __name__ == '__main__':
      from vllm import LLM, SamplingParams
      import json, time
      llm = LLM(model="<model_path>", dtype="bfloat16",
                tensor_parallel_size=1, enforce_eager=True)
      t0 = time.time()
      outs = llm.generate(["<prompt>"] * 4, SamplingParams(max_tokens=128))
      tps = sum(len(o.outputs[0].token_ids) for o in outs) / (time.time()-t0)
      print(json.dumps({"tps": round(tps,2)}))
  PYEOF
  python $WORKDIR/bench.py
  """
  )

# ── BUILD RECIPE ───────────────────────────────────────────────────────────

build_notes: |
  Venv: /gpfs/wolf2/olcf/csc708/scratch/hzheng/vllm-rocm-odo
  Python 3.10.13 (miniforge3). ROCm torch 2.6.0+rocm6.1.

  Key build lessons (2026-05-11, 15+ iterations):
  1. No pre-built ROCm vLLM on PyPI — must build from source
  2. Use `python setup.py develop` NOT `pip install -e .`
     (pyproject.toml license field incompatible with setuptools 65.5)
  3. Patch pyproject.toml BEFORE building:
       sed -i 's/license = "Apache-2.0"/license = {text = "Apache-2.0"}/' pyproject.toml
       sed -i '/^license-files/d' pyproject.toml
  4. torch 2.6.0+rocm6.1 vs system ROCm 6.2.4 causes HIP compile failure;
     use torch+rocm6.2 for building
  5. SETUPTOOLS_SCM_PRETEND_VERSION=0.9.2 to prevent version detection errors
  6. Keep setuptools at 65.5.0 (newer versions reject the pyproject.toml format)

  Source: github.com/vllm-project/vllm (main branch, commit 8415bf2)
  Proxy required: export http_proxy=http://proxy.ccs.ornl.gov:3128

# ── FAILURE LOG ────────────────────────────────────────────────────────────

failure_log:
  - error: "RuntimeError: An attempt has been made to start a new process before bootstrapping"
    cause: "LLM() called at module top level; spawn re-runs the script"
    fix: "Wrap all LLM code in `if __name__ == '__main__':`"

  - error: "FileNotFoundError: code/<stdin>"
    cause: "Script run via `python - <<'EOF'`; spawn can't re-read stdin"
    fix: "Write script to a .py file and run `python /path/to/file.py`"

  - error: "RuntimeError: Unknown runtime environment (setup.py)"
    cause: "setuptools 79+ enforces strict pyproject.toml; vllm uses old format"
    fix: "Keep setuptools at 65.5.0; patch pyproject.toml license field"

  - error: "FAILED: activation_kernels.hip.o (HIP compile error)"
    cause: "torch+rocm6.1 headers vs system ROCm 6.2.4 mismatch"
    fix: "Install torch+rocm6.2 before building"

  - error: "No HIP GPUs are available"
    cause: "HIP_VISIBLE_DEVICES unset; Slurm sets CUDA_VISIBLE_DEVICES=none"
    fix: "Set HIP_VISIBLE_DEVICES=CUDA_VISIBLE_DEVICES to same value"

  - error: "S3M batch jobs die in 1-2s with signal 53"
    cause: "csc708_auser has seccomp batch block on Odo compute nodes"
    fix: "Use ClearML odo-services queue (login node, has GPU access)"

# ── BENCHMARK RESULTS ──────────────────────────────────────────────────────

benchmark:
  date: "2026-05-11"
  model: "LLaMA-3.1-8B Instruct"
  hardware: "AMD MI210 (1 GCD), login1"
  vllm_version: "0.8.5+rocm"
  tp_size: 1
  backend: "ROCmFlashAttention"
  results:
    concurrency_1: {throughput_tps: 86.4, note: "4 prompts, 512 tokens in 5.9s"}
    concurrency_4: {throughput_tps: 613.5, note: "16 prompts, 2048 tokens in 3.3s"}

keywords: ["vLLM", "ROCm", "AMD GPU", "MI250X", "MI210", "LLM inference", "gfx90a"]
aliases: ["vllm", "llm-serving", "rocm-vllm"]

defaults:
  nodes: 1
  walltime: 3600
  partition: "batch"
  account: "csc708"

references:
  - "knowledgebase/hpc/lessons/amd_rocm_model_serving.md"
  - "jobs/odo/mfi_serve/run_v6.sh"
