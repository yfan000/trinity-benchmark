name: "OpenMM"
description: "GPU-accelerated molecular dynamics — XPU/PVC support via OpenCL platform"
category: simulation
version: "8.3.1"

binary: "/lus/flare/projects/datascience/hzheng/software/aurora/openmm_venv_v1/bin/python"
install_path: "/lus/flare/projects/datascience/hzheng/software/aurora/openmm_venv_v1"
build_status: built

modules:
  - frameworks

setup:
  - "unset PYTHONPATH PYTHONHOME LD_PRELOAD"
  - "module use /soft/modulefiles"
  - "module load frameworks"
  - "source /lus/flare/projects/datascience/hzheng/software/aurora/openmm_venv_v1/bin/activate"

gpu_support: true
gpu_notes: |
  OpenCL platform exposes Aurora PVC (XPU) at speed=50.0. Available platforms after install:
    [0] Reference (speed=1.0)
    [1] CPU (speed=10.0)
    [2] OpenCL (speed=50.0) — XPU backend
  No CUDA, no HIP, no CPU-only fallback needed: stock OpenMM 8.3.1 wheel from PyPI is XPU-capable
  out of the box via Intel Compute Runtime's OpenCL ICD.

run_command: |
  # In a python script:
  #   platform = openmm.Platform.getPlatformByName('OpenCL')
  #   simulation = Simulation(top, system, integrator, platform)
  python my_md_script.py

input_files: [".pdb", ".prmtop", ".inpcrd", ".xml"]

# --- Auto-detection ---
keywords: ["OpenMM", "molecular dynamics", "MD", "simulation", "biomolecular", "force field"]
aliases: ["openmm"]

input_detection:
  extensions: [".pdb", ".prmtop", ".inpcrd"]
  filenames: []
  content_markers: ["import openmm", "from openmm", "Simulation(", "ForceField("]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  account: "Aurora_deployment"

scaling_notes: |
  Single-GPU (single PVC tile) recommended — OpenMM is not multi-GPU-aware via OpenCL.
  For multi-replica throughput use one Python process per tile via mpiexec --bind-to.

# --- Input validation ---
required_inputs: []
optional_inputs: [".pdb", ".prmtop", ".inpcrd", ".xml"]

# --- Output retrieval ---
output_patterns: ["*.dcd", "*.log", "*.chk", "trajectory.*"]

build_notes: |
  Built 2026-05-02 via jobs/aurora/build_openmm/run_v1.sh on aurora-services queue (8m20s).
  Recipe: `module load frameworks` (Aurora 2025.3.1 stack, Python 3.12.12), then
  `python -m venv --system-site-packages` + `pip install --only-binary :all: openmm`.
  No XPU-specific wheel needed — PyPI's manylinux openmm 8.3.1 (14 MB) finds Intel's OpenCL ICD
  automatically through the frameworks module's OneAPI runtime libs.

notes: "First-attempt success — proves XPU/PVC molecular-dynamics is accessible without any forked OpenMM. Performance benchmarks vs. CUDA on A100 not yet collected; would be a useful next step."
