name: "chai-lab"
description: "Chai-1 protein structure prediction model (XPU-ported fork for Aurora Intel PVC)"
category: ml-framework
version: "0.6.1"

binary: "python"
install_path: "/lus/flare/projects/datascience/hzheng/software/aurora/chai_lab/venv"

modules:
  - "frameworks/2025.3.1"

setup:
  - "export PYTHONNOUSERSITE=1"              # MUST come before module load
  - "unset PYTHONPATH PYTHONHOME LD_PRELOAD"
  - "module use /soft/modulefiles"
  - "module load frameworks/2025.3.1"        # Python 3.12.12 — matches the venv
  - "source /lus/flare/projects/datascience/hzheng/software/aurora/chai_lab/venv/bin/activate"

gpu_support: true
gpu_notes: "Intel XPU (PVC / Ponte Vecchio) via torch.xpu. device=None defaults to 'xpu:0'. Requires compute node (xpu not available on login nodes)."

python_version: "3.12.12"
torch_version: "2.10.0a0+git449b176"
ipex_version: "2.10.10+gitd0f992f"
triton_xpu_version: "3.4.0+gitae324eea"

run_command: |
  python -c "
  from chai_lab.chai1 import run_inference
  import pathlib
  candidates = run_inference(
      fasta_file=pathlib.Path('input.fasta'),
      output_dir=pathlib.Path('output'),
      num_trunk_recycles=3,
      num_diffn_timesteps=200,
      seed=42,
      device=None,           # defaults to 'xpu:0' in the XPU fork
      use_esm_embeddings=True,
      use_msa_server=False,
      low_memory=True,
  )
  "

input_files: [".fasta", ".fa"]
output_patterns: ["output/pred.model_idx_*.cif", "output/scores.model_idx_*.npz"]
output_notes: |
  scores.model_idx_0.npz keys (verified 2026-05-06):
    aggregate_score (1,): overall confidence combining ptm and iptm — low for single chains
    ptm (1,): predicted TM-score for single-chain fold quality (0–1, >0.5 = meaningful fold)
    iptm (1,): interface pTM — always 0 for single-chain predictions
    per_chain_ptm, per_chain_pair_iptm, has_inter_chain_clashes, chain_chain_clashes
  For single-chain stability ranking use ptm, NOT aggregate_score (which iptm=0 drags down).
  pTM > 0.5: meaningful fold; > 0.7: good confidence; > 0.9: very high confidence.
  NOTE: there is no "plddt" key — per-residue pLDDT is not stored in this fork's npz output.

performance:
  node_type: "Aurora compute (Intel Max 1550 PVC)"
  xpu_tiles: 12
  trunk_recycles_per_sec: "~1.3 s/recycle"
  diffusion_steps_per_sec: "~16 steps/s"
  walltime_23aa: "~17 s end-to-end (weights cached)"
  walltime_first_run: "~2 min (ESM-2 3B + chai-1 weights download)"

keywords: ["chai", "chai-1", "chai1", "protein folding", "protein structure", "structure prediction", "XPU", "PVC", "pLDDT", "AlphaFold alternative"]
aliases: ["chai", "chai1", "chai-lab", "chai_lab"]

input_detection:
  extensions: [".fasta", ".fa", ".faa"]
  content_markers: [">"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  account: "datascience"
  filesystems: "flare"

build_notes: |
  Installed 2026-05-04. Source: pip install git+https://github.com/msinclair-py/chai-lab.git
  Aurora XPU port by msinclair-py (chai_lab==0.6.1, commit 990ba49).
  Venv built with --system-site-packages from frameworks/2025.3.1 (Python 3.12) at install time.
  Key deps built from source: rdkit 2026.3.1, gemmi 0.7.5, biopython 1.87 (~10 min total).

  GOTCHAS (discovered 2026-05-06):
  - PYTHON VERSION MISMATCH: `module load frameworks` (unqualified) now gives Python 3.10.14,
    but the venv is Python 3.12.12. Always use `module load frameworks/2025.3.1` explicitly.
  - PYTHONNOUSERSITE=1 must be exported BEFORE any module load, not after — otherwise the
    stale ~/.local/aurora/frameworks/2025.3.1/lib/python3.12/site-packages/torchtitan.pth
    causes "Fatal Python error: init_import_site: Failed to import the site module".
  - PBS output: always specify `#PBS -o /path/on/flare/job.log` — without it, PBS writes
    to the compute node's home which is not accessible from the login node.
  - output_dir passed to run_inference must be COMPLETELY EMPTY (not just non-existent) —
    do NOT put input.fasta inside the output_dir. Write fasta to a sibling directory and
    pass a fresh subdirectory (e.g. seq_dir/"output") as output_dir.
  - xpu not available on login nodes; torch.xpu.device_count() returns 0 on aurora-uan-*.
  - device=None → "xpu:0" by default in the XPU fork (correct for Aurora).

build_status: "completed"
build_script: "jobs/aurora/build_chai_lab/install.sh"
inference_script: "jobs/aurora/chai_lab_3seq/run.sh"
