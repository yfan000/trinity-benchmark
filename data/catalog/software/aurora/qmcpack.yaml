name: "QMCPACK"
description: "Quantum Monte Carlo code with SYCL/OpenMP offload for Intel GPU acceleration"
category: dft
version: "v4.0.0"
build_status: built

binary: "/lus/flare/projects/datascience/hzheng/software/aurora/qmcpack/v4.0.0/bin/qmcpack"
install_path: "/lus/flare/projects/datascience/hzheng/software/aurora/qmcpack/v4.0.0"

modules:
  - oneapi/release
  - intel_compute_runtime
  - cmake

setup:
  - "module use /soft/modulefiles"
  - "module load oneapi/release"
  - "module load intel_compute_runtime"
  - "module load cmake"
  - "unset PYTHONPATH"
  - "export PATH=/lus/flare/projects/datascience/hzheng/software/aurora/qmcpack/v4.0.0/bin:$PATH"

gpu_support: true
gpu_notes: "Intel Data Center GPU Max Series via SYCL offload (ENABLE_SYCL=ON, OFFLOAD_TARGET=spir64)"

run_command: |
  mpiexec -n 6 --ppn 6 qmcpack input.xml

defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  ppn: 6

scaling_notes: "6 Intel GPU tiles per node. QMCPACK SYCL build targets spir64 for Intel GPUs."

keywords: ["quantum Monte Carlo", "QMC", "electronic structure", "correlated electrons", "QMCPACK"]
aliases: ["qmcpack", "qmc"]

input_detection:
  extensions: [".xml"]
  content_markers: ["qmcsystem", "wavefunction", "hamiltonian"]

required_inputs: [".xml", ".h5"]
optional_inputs: [".BFD.xml", ".ccECP.xml"]
output_patterns: ["*.scalar.dat", "*.stat.h5", "*.s*.config.h5"]

notes: |
  Built with MPICH wrappers (mpicc/mpicxx) + Intel MKL (BLA_VENDOR=Intel10_64lp_seq).
  Boost 1.86.0 downloaded from source. SYCL offload enabled with spir64 target.
  Build script: jobs/aurora/build_qmcpack/run.sh
