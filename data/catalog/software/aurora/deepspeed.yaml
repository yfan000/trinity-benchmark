name: "DeepSpeed (XPU)"
description: "Microsoft DeepSpeed with Intel XPU support, built on top of PyTorch XPU for Aurora"
category: ml-framework
version: "latest"
build_status: needs_build

binary: ""
install_path: "/lus/flare/projects/datascience/hzheng/software/aurora/pytorch-xpu-main"
conda_env: "/lus/flare/projects/datascience/hzheng/software/aurora/pytorch-xpu-main/conda_env"

modules:
  - oneapi/release
  - intel_compute_runtime

setup:
  - "module use /soft/modulefiles"
  - "module load oneapi/release"
  - "module load intel_compute_runtime"
  - "unset PYTHONPATH"
  - "CONDA_BIN=/opt/aurora/26.26.0/spack/unified/1.1.1/install/linux-x86_64/miniforge3-25.11.0-1-khkcc6i/bin/conda"
  - "eval \"$(${CONDA_BIN} shell.bash hook)\""
  - "conda activate /lus/flare/projects/datascience/hzheng/software/aurora/pytorch-xpu-main/conda_env"

gpu_support: true
gpu_notes: "Intel Data Center GPU Max Series via PyTorch XPU + Intel oneAPI extensions for DeepSpeed"

run_command: |
  deepspeed --num_gpus=6 train.py --deepspeed_config ds_config.json

defaults:
  nodes: 1
  walltime: 3600
  queue: "debug"
  ppn: 6

scaling_notes: "Requires PyTorch XPU to be installed first. 6 XPU tiles per node."

keywords: ["DeepSpeed", "distributed training", "ZeRO", "model parallelism", "LLM training"]
aliases: ["deepspeed", "ds"]

notes: |
  Installed into the same conda env as PyTorch XPU.
  Depends on PyTorch XPU being installed first (jobs/aurora/build_pytorch/run.sh).
  Intel Extension for PyTorch (intel_extension_for_pytorch) also installed.
  Build script: jobs/aurora/build_deepspeed/run.sh
