name: "HPL"
description: "High Performance Linpack benchmark using Intel MKL on Aurora"
category: benchmark
version: "2.3"
build_status: built

binary: "/lus/flare/projects/datascience/hzheng/software/aurora/hpl/bin/xhpl"
install_path: "/lus/flare/projects/datascience/hzheng/software/aurora/hpl"

modules:
  - oneapi/release
  - intel_compute_runtime

setup:
  - "module use /soft/modulefiles"
  - "module load oneapi/release"
  - "module load intel_compute_runtime"
  - "unset PYTHONPATH"
  - "export PATH=/lus/flare/projects/datascience/hzheng/software/aurora/hpl/bin:$PATH"

gpu_support: false
gpu_notes: "CPU-only build with Intel MKL. Intel MKL on Aurora Sapphire Rapids CPUs is highly optimized."

run_command: |
  mpiexec -n 104 --ppn 104 xhpl

input_files: ["HPL.dat"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 104

scaling_notes: "104 CPU cores per Sapphire Rapids node. Intel MKL provides BLAS with AMX acceleration."

keywords: ["HPL", "Linpack", "benchmark", "high performance", "FLOPS", "TOP500"]
aliases: ["hpl", "xhpl", "linpack"]

required_inputs: ["HPL.dat"]
optional_inputs: []
output_patterns: ["HPL.out"]

notes: |
  Built with Intel MKL + MPICH wrappers. Intel MKL provides optimized DGEMM on Sapphire Rapids.
  HPL.dat tuning: NB=256, P*Q=nprocs, problem size N depends on memory.
  Build script: jobs/aurora/build_hpl/run.sh
