name: "LAMMPS"
description: "Classical molecular dynamics with GPU acceleration via Kokkos"
category: simulation
version: "stable_2Aug2023_update3"

binary: "/eagle/datascience/hzheng/software/lammps/bin/lmp"
install_path: "/eagle/datascience/hzheng/software/lammps"

modules: []

setup:
  - "module load PrgEnv-gnu"
  - "module swap gcc-native gcc-native/12.3"
  - "module load cray-mpich"
  - "module load cudatoolkit-standalone"
  - "export PATH=/eagle/datascience/hzheng/software/lammps/bin:$PATH"

gpu_support: true
gpu_notes: "Via Kokkos backend (-k on g <ngpus> -sf kk -pk kokkos)"

run_command: |
  mpiexec -n 4 --ppn 4 lmp -in input.lammps -k on g 4 -sf kk -pk kokkos

input_files: [".lammps", ".in", ".data"]

# --- Auto-detection ---
keywords: ["molecular dynamics", "MD simulation", "classical MD", "force field", "Lennard-Jones", "materials science", "polymer", "LAMMPS"]
aliases: ["lammps", "lmp", "lmp_mpi"]

input_detection:
  extensions: [".lammps", ".lmp"]
  filenames: []
  content_markers: ["units", "atom_style", "pair_style", "fix", "dump"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "Use Kokkos GPU backend for acceleration. 4 MPI ranks per node with 1 GPU each. Scale nodes for large systems (>1M atoms)."

# --- Input validation ---
required_inputs: [".lammps", ".in", ".lmp"]
optional_inputs: [".data", ".restart"]

# --- Output retrieval ---
output_patterns: ["log.lammps", "*.dump", "*.lammpstrj"]

notes: "Verify exact module name and binary path on Polaris before use."
