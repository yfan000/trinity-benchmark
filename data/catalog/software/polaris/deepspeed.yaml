name: "DeepSpeed"
description: "Microsoft DeepSpeed distributed deep learning training with ZeRO optimizer"
category: ml-framework
version: "0.14.x"

binary: "deepspeed"
install_path: "/eagle/datascience/hzheng/software/polaris/deepspeed"

modules: []

setup:
  - "module load conda"
  - "conda activate /eagle/datascience/hzheng/software/polaris/deepspeed/ds-env"
  - "export DS_BUILD_CPU_ADAM=1"

gpu_support: true
gpu_notes: "Supports ZeRO-1/2/3 optimizer states sharding, mixed-precision (fp16/bf16), and pipeline parallelism across multiple GPUs and nodes."

run_command: |
  deepspeed --num_gpus=4 train.py --deepspeed ds_config.json

input_files: [".py", ".json"]

# --- Auto-detection ---
keywords: ["deepspeed", "ZeRO", "distributed training", "model parallelism", "ZeRO-3", "mixed precision", "fp16", "bf16", "large model training", "gradient checkpointing", "LoRA", "FSDP"]
aliases: ["deepspeed", "ds", "zero", "zero3", "zero-3"]

input_detection:
  extensions: [".json", ".py"]
  filenames: ["ds_config.json", "deepspeed_config.json", "train.py"]
  content_markers: ["deepspeed", "zero_optimization", "ZeRO", "ds_config", "fp16", "bf16"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "For single-node use --num_gpus=4. For multi-node use --hostfile and set --num_nodes=N. ZeRO-3 enables training models larger than single-GPU VRAM. Use bf16 on A100s for best throughput. Install via: pip install deepspeed into a PyTorch conda env."

# --- Input validation ---
required_inputs: [".py", "ds_config.json"]
optional_inputs: ["hostfile", "requirements.txt"]

# --- Output retrieval ---
output_patterns: ["checkpoint_*", "*.pt", "*.pth", "global_step*/", "logs/", "*.log"]

notes: "Install into a PyTorch conda env via pip install deepspeed. On Polaris the cpu_adam ops may require DS_BUILD_CPU_ADAM=1 at install time. Confirm nccl availability in the PyTorch env."

build_status: "installed"
install_notes: "Installed 2026-05-10 via pip into ds-env venv. Used DS_BUILD_OPS=0 to skip custom op compilation (avoids CUDA extension build failures on Polaris)."
