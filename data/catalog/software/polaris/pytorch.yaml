name: "PyTorch"
description: "Deep learning framework with GPU acceleration via CUDA, NCCL, and cuDNN"
category: ml-framework
version: "2.3.0"

binary: "python"
install_path: "/soft/applications/conda/2024-04-29/pytorch"

modules: []

setup:
  - "module load conda"
  - "conda activate"

gpu_support: true
gpu_notes: "CUDA, NCCL, and cuDNN bundled in ALCF conda env. Supports all 4 A100 GPUs per node via torchrun."

run_command: |
  torchrun --nproc_per_node=4 train.py

input_files: [".py"]

# --- Auto-detection ---
keywords: ["pytorch", "deep learning", "neural network", "training", "LLM", "transformer", "GPU training", "distributed training", "torchrun", "NCCL", "CUDA", "machine learning"]
aliases: ["pytorch", "torch", "torchrun", "pt"]

input_detection:
  extensions: [".py"]
  filenames: ["train.py", "main.py"]
  content_markers: ["import torch", "torch.nn", "torch.distributed", "torchrun", "DataLoader"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "Use torchrun --nproc_per_node=4 for single-node 4-GPU jobs. For multi-node use --nnodes=N and set MASTER_ADDR/MASTER_PORT. NCCL backend recommended for GPU communication."

# --- Input validation ---
required_inputs: [".py"]
optional_inputs: ["requirements.txt", "config.yaml", "ds_config.json"]

# --- Output retrieval ---
output_patterns: ["*.pt", "*.pth", "checkpoint_*", "logs/", "*.log"]

notes: "ALCF-provided conda env at /soft/applications/conda/2024-04-29/pytorch includes PyTorch, NCCL, cuDNN, and common ML libraries. No build required."

build_status: "installed"
