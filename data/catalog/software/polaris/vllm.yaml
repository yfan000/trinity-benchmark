name: "vLLM"
description: "High-throughput LLM inference server with PagedAttention and tensor parallelism"
category: ml-framework
version: "0.11.2"

binary: "/eagle/datascience/hzheng/software/polaris/vllm/vllm-env/bin/python"
install_path: "/eagle/datascience/hzheng/software/polaris/vllm"
build_status: built

modules: []

setup:
  - "unset PYTHONPATH PYTHONHOME"
  - "source /eagle/datascience/hzheng/software/polaris/vllm/vllm-env/bin/activate"
  - "export HF_HOME=/eagle/datascience/hzheng/.cache/huggingface"

gpu_support: true
gpu_notes: "Tensor parallelism across 4 A100s per node via --tensor-parallel-size 4. PagedAttention for efficient KV-cache management. Built with torch 2.9.0+cu128, runs on Polaris CUDA 12.6 driver."

run_command: |
  python -m vllm.entrypoints.openai.api_server \
    --model <model_name_or_path> \
    --tensor-parallel-size 4 \
    --port 8000 \
    --dtype bfloat16

input_files: []

# --- Auto-detection ---
keywords: ["vllm", "LLM inference", "language model serving", "OpenAI API", "tensor parallelism", "PagedAttention", "model serving", "inference server", "llama", "mistral", "GPU inference"]
aliases: ["vllm", "vllm-server", "llm-server", "openai-server"]

input_detection:
  extensions: [".py"]
  filenames: []
  content_markers: ["from vllm", "import vllm", "vllm.entrypoints", "LLM(", "SamplingParams"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "Single node supports 4-way tensor parallelism across 4 A100s (320 GB total VRAM). For larger models use pipeline parallelism across multiple nodes. Set --max-model-len to control context window based on available VRAM."

# --- Available models on Eagle ---
models:
  - "/eagle/datascience/hzheng/models/llama3-8b-instruct"
  - "/eagle/datascience/hzheng/models/gpt-oss-120b"

# --- Input validation ---
required_inputs: []
optional_inputs: ["config.json"]

# --- Output retrieval ---
output_patterns: ["*.log", "vllm_*.log"]

build_notes: |
  Built 2026-04-27 via jobs/polaris/build_vllm/run.sh, submitted as ClearML
  task d6e9f99e2bcc44fb875a817623b99b6d on polaris-services (12.7 min, login-node).
  Standalone conda env (no --system-site-packages). Bypasses the Polaris
  clearml-agent + `module load conda` trap by calling /soft/.../mconda3/bin/conda
  directly.
  Versions: Python 3.12.13 | vllm 0.11.2 | torch 2.9.0+cu128 | torch.cuda 12.8 |
  transformers 4.57.6. (torch was originally pinned at 2.7.1 but pip resolved
  upward to satisfy vllm==0.11.2 dependency requirements.)
  Smoke test (task 1862bf8a) verified imports + llama-3.1-8b tokenizer + config
  load on polaris-login-04. GPU verification deferred to compute-node serve job.

build_notes_smoke: |
  GPU smoke test confirmed 2026-05-11: 2514.4 tokens/s (Llama-3.1-8B, TP=4, bfloat16).
  CRITICAL: In PBS login shell, conda overrides PATH after venv activate.
  ALWAYS use full python path: /eagle/datascience/hzheng/software/polaris/vllm/vllm-env/bin/python
  Never rely on `python` after `source activate` in a #!/bin/bash -l script.

serving_notes: |
  Validated 2026-05-12 serving Llama-3.1-8B (TP=4, bfloat16, max_model_len=8192)
  on persistent ClearML agent on x3001c0s13b0n0 under reservation R7143698.
  Cold load: ~32s shard load + ~21s torch.compile + ~6s graph capture = ~110s
  before "Application startup complete". KV cache 30 GiB, 120x concurrency at
  8192-token context. First chat completion <7s end-to-end via /v1/chat/completions.
  See jobs/polaris/vllm_llama31_8b/run_2026-05-12/run.sh for the full script.

# IMPORTANT serving lessons (apply to ALL polaris-persistent-compute vLLM jobs):
serving_lessons:
  - id: cuda_visible_devices_strip
    severity: blocker
    detail: |
      ClearML agent in --services-mode strips CUDA_VISIBLE_DEVICES when launching
      child tasks. PBS allocates 4 A100s, nvidia-smi -L sees them, but vLLM's
      ParallelConfig pydantic-fails with
      "Tensor parallel size (4) cannot be larger than the number of available
       GPUs (0)". Fix: `export CUDA_VISIBLE_DEVICES=0,1,2,3` inside run.sh
      after `unset PYTHONPATH PYTHONHOME`.
  - id: container_image_must_be_empty
    severity: blocker
    detail: |
      For polaris compute / persistent-compute queues, pass container_image=""
      to clearml_submit_task. Default injects nvidia/cuda:12.6.3 docker without
      /eagle bind-mount, so MODEL_PATH disappears.
  - id: usage_stats_quota
    severity: cosmetic
    detail: |
      vLLM background telemetry thread tries to write
      ~/.config/vllm/usage_stats.json -> OSError 122 Disk quota exceeded
      on Polaris home. Non-fatal. Set VLLM_NO_USAGE_STATS=1 to silence.
  - id: served_name_match
    severity: blocker
    detail: |
      The `model` field in /v1/* requests MUST match --served-model-name set
      at launch (not the HF repo name). With --served-model-name=llama-3.1-8b,
      requests must use {"model": "llama-3.1-8b"}.
  - id: localhost_proxy
    severity: blocker
    detail: |
      Always `unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY` in inference
      run.sh. ALCF Squid intercepts even localhost HTTP otherwise.
  - id: same_node_inference
    severity: design
    detail: |
      vLLM listens on http://0.0.0.0:8000 inside the compute node only. To
      query it, submit one-shot inference tasks to the SAME -persistent-compute
      queue so they land on the same node. There is no SSH tunnel and no
      inbound external port.

notes: "Use the standalone conda env at install_path. HF_HOME on Eagle to keep model cache off the home quota. Model weights pre-downloaded under /eagle/datascience/hzheng/models/."
