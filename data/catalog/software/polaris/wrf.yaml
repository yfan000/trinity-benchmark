name: "WRF"
description: "Weather Research and Forecasting model for mesoscale numerical weather prediction"
category: simulation
version: "4.6.0"

binary: "/eagle/datascience/hzheng/software/polaris/wrf/main/wrf.exe"
install_path: "/eagle/datascience/hzheng/software/polaris/wrf"

modules: []

setup:
  - "module load PrgEnv-gnu"
  - "module swap gcc-native gcc-native/12.3"
  - "module load cray-mpich"
  - "module load cray-hdf5"
  - "module load cray-netcdf"
  - "export WRF_DIR=/eagle/datascience/hzheng/software/polaris/wrf"
  - "export PATH=$WRF_DIR/main:$PATH"

gpu_support: false
gpu_notes: "Standard WRF is CPU-only. GPU-accelerated WRF (via OpenACC) requires separate build and is not standard."

run_command: |
  mpiexec -n 16 --ppn 4 wrf.exe

input_files: ["namelist.input", "namelist.wps"]

# --- Auto-detection ---
keywords: ["wrf", "weather model", "numerical weather prediction", "NWP", "mesoscale", "atmospheric simulation", "WPS", "climate", "meteorology", "atmospheric dynamics", "WRFDA", "data assimilation"]
aliases: ["wrf", "wrf.exe", "wrfv4", "wrf4", "weather-research-forecasting"]

input_detection:
  extensions: []
  filenames: ["namelist.input", "namelist.wps", "wrf.exe"]
  content_markers: ["&time_control", "&domains", "&physics", "&dynamics", "&bdy_control", "wrf_core"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "Decompose domain across nodes: set nproc_x * nproc_y = total MPI ranks in namelist.input. Requires WPS preprocessing (geogrid, ungrib, metgrid) before wrf.exe. Link met_em* and wrfbdy_d01/wrfinput_d01 to run directory."

# --- Input validation ---
required_inputs: ["namelist.input", "wrfinput_d01", "wrfbdy_d01"]
optional_inputs: ["namelist.wps", "met_em*"]

# --- Output retrieval ---
output_patterns: ["wrfout_*", "rsl.out.*", "rsl.error.*", "*.nc"]

notes: "Build requires netCDF-C and netCDF-Fortran (cray-netcdf). Configure with: ./configure (choose dmpar + gcc), then ./compile em_real. Also build WPS for preprocessing. Link static geography data."

build_status: "installed"
install_notes: "Built 2026-05-10 v12. Key fix: configure.wrf sets FC=time $(DM_FC); sed patch removes 'time' wrapper before compile."
