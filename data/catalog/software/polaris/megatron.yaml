name: "Megatron-LM"
description: "NVIDIA Megatron-LM / Megatron-Core LLM training with tensor, pipeline, and data parallelism. Installed at /eagle/datascience/hzheng/software/polaris/megatron with a project-local venv layered on the ALCF mconda3."
category: ml-framework
version: "core_r0.10+ (editable install — `pip show megatron-core` for exact)"

binary: "python"
install_path: "/eagle/datascience/hzheng/software/polaris/megatron"

modules:
  - conda

# Correct activation order, verified 2026-05-12 from
# /eagle/datascience/hzheng/software/polaris/megatron/venv/pyvenv.cfg:
#   home = /soft/applications/conda/2024-04-29/mconda3/bin
#   include-system-site-packages = true
# So the venv layers Megatron-specific deps (apex, transformer_engine, ...)
# on top of mconda3's PyTorch — activate mconda3 first, then the venv.
setup:
  - "module use /soft/modulefiles"
  - "module load conda"
  - "conda activate"
  - "source /eagle/datascience/hzheng/software/polaris/megatron/venv/bin/activate"
  - "export CUDA_DEVICE_MAX_CONNECTIONS=1"

# Old setup (kept for reference) — broken on modern Polaris because:
#   1. missing `module use /soft/modulefiles` so `module load conda` 404s
#   2. activates the system pytorch env instead of the project's venv,
#      missing apex / transformer_engine / megatron_core editable install
# DO NOT USE:
#   - "module load conda"
#   - "conda activate /soft/applications/conda/2024-04-29/pytorch"
#   - "export PYTHONPATH=/eagle/datascience/hzheng/software/polaris/megatron:$PYTHONPATH"

gpu_support: true
gpu_notes: "Tensor parallelism + pipeline parallelism + data parallelism (3D parallelism) across GPUs and nodes. Modern Megatron-Core uses TransformerEngine for fused attention/LayerNorm; legacy NVIDIA apex still used for fused Adam optimizer in some paths."

run_command: |
  torchrun --nproc_per_node=4 \
    pretrain_gpt.py \
    --tensor-model-parallel-size 4 \
    --pipeline-model-parallel-size 1 \
    --num-layers 24 \
    --hidden-size 1024 \
    --num-attention-heads 16 \
    --seq-length 2048 \
    --max-position-embeddings 2048 \
    --micro-batch-size 4 \
    --global-batch-size 16 \
    --data-path data/my-gpt2_text_document \
    --split 900,50,50

input_files: [".py"]

# --- Auto-detection ---
keywords: ["megatron", "Megatron-LM", "megatron-core", "large language model", "LLM pretraining", "tensor parallelism", "pipeline parallelism", "GPT pretraining", "BERT training", "T5 training", "3D parallelism", "apex", "transformer_engine", "TE", "fused kernels"]
aliases: ["megatron", "megatron-lm", "megatron-core", "mcore"]

input_detection:
  extensions: [".py", ".sh"]
  filenames: ["pretrain_gpt.py", "pretrain_bert.py", "pretrain_t5.py", "pretrain_mamba.py", "pretrain_vlm.py"]
  content_markers: ["megatron", "tensor-model-parallel", "pipeline-model-parallel", "pretrain_gpt", "MegatronModule", "transformer_engine"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: |
  Use --tensor-model-parallel-size 4 to fill a single Polaris node (4 × A100 40GB).
  Scale --pipeline-model-parallel-size and DP across nodes for multi-node runs.
  Set CUDA_DEVICE_MAX_CONNECTIONS=1 for proper overlap of tensor-parallel comms
  with compute. For multi-node, also set NCCL_NET_GDR_LEVEL=PHB and use the
  Polaris HSN tuning from knowledgebase/hpc/lessons/.

# --- Input validation ---
required_inputs: [".py"]
optional_inputs: ["tokenizer_model", "data_path", "checkpoint_path"]

# --- Output retrieval ---
output_patterns: ["checkpoints/", "logs/", "*.log", "iter_*", "tensorboard/"]

# --- Provenance ---
verified:
  date: "2026-05-12"
  by: "live IRI listing of install_path + pyvenv.cfg inspection"
  install_artifacts:
    - "pretrain_gpt.py / pretrain_bert.py / pretrain_t5.py / pretrain_mamba.py / pretrain_vlm.py"
    - "megatron_core.egg-info (editable install)"
    - "venv/ (Python 3.11.8, --system-site-packages over mconda3)"

notes: |
  This is an editable install (`pip install -e .` inside the venv) of the
  upstream Megatron-LM repo, with apex + transformer_engine layered in via
  --system-site-packages from mconda3. To upgrade, `cd install_path && git
  pull && source venv/bin/activate && pip install -e .`. Data must be
  preprocessed with Megatron's tools/preprocess_data.py before training.

build_status: "installed"
