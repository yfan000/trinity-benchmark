name: NIXL
version: "1.1.0"
description: "NVIDIA Inference Xfer Library — high-perf point-to-point transfers for AI inference (KV-cache, TP comms)"
source: "https://github.com/ai-dynamo/nixl"
binary: /eagle/datascience/hzheng/software/polaris/nixl_stack/nixl/bin/nixlbench
install_path: /eagle/datascience/hzheng/software/polaris/nixl_stack/nixl
deps_path: /eagle/datascience/hzheng/software/polaris/nixl_stack/deps
ucx_path: /eagle/datascience/hzheng/software/polaris/nixl_stack/ucx
build_script: jobs/polaris/build_nixl/run.sh

modules:
  - PrgEnv-gnu
  - gcc-native/12.3
  - cudatoolkit-standalone
  - spack-pe-gnu
  - cmake

setup:
  - export BASE=/eagle/datascience/hzheng/software/polaris/nixl_stack
  - export NIXL_PREFIX=$BASE/nixl
  - export UCX_PREFIX=$BASE/ucx
  - export DEPS=$BASE/deps
  - export LD_LIBRARY_PATH=$NIXL_PREFIX/lib64:$UCX_PREFIX/lib:$DEPS/lib:$LD_LIBRARY_PATH
  - export PATH=$NIXL_PREFIX/bin:$UCX_PREFIX/bin:$PATH

gpu_support: true
gpu_notes: |
  UCX built with CUDA 12.2 support (--with-cuda) for GPU memory transfers.
  Plugins enabled: UCX (network), POSIX (file I/O).
  VRAM↔VRAM transfers use CUDA IPC on single-node; requires etcd for multi-process UCX benchmarks.

key_deps:
  ucx: "1.20.1 (from source, gcc 12.3, --with-cuda, --enable-cma, no verbs)"
  hwloc: "2.10.0 (from source)"
  gflags: "2.2.2 (from source)"
  abseil-cpp: "20250814.1 (meson subproject)"
  taskflow: "v3.10.0 (meson subproject)"
  prometheus-cpp: "meson subproject"

benchmark_tool: nixlbench
benchmark_examples:
  posix_eagle: |
    nixlbench --backend POSIX --filepath /eagle/datascience/hzheng/nixl_bench_test \
      --posix_api_type AIO --op_type WRITE --start_block_size 4096 --max_block_size 67108864
  posix_local: |
    nixlbench --backend POSIX --filepath /tmp/nixl_bench_test \
      --posix_api_type URING --op_type WRITE --start_block_size 4096 --max_block_size 67108864
  ucx_dram_single_node: |
    # requires etcd running: etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://localhost:2379 &
    nixlbench --etcd_endpoints http://localhost:2379 --backend UCX --initiator_seg_type DRAM --target_seg_type DRAM &
    sleep 2 && nixlbench --etcd_endpoints http://localhost:2379 --backend UCX --initiator_seg_type DRAM --target_seg_type DRAM

build_notes: |
  Built 2026-05-09. Key non-obvious fixes required (11 iterations):
  1. binary=bash in ClearML task (polaris-services agent defaults to python3 runner)
  2. Safe SOFT_PY discovery (ls -d glob fails under set -e; use find + || true)
  3. UCX: latest release is v1.20.1, not v1.21.x (use wget tarball, not git branch)
  4. unset PYTHONPATH PYTHONHOME + PYTHONNOUSERSITE=1 before venv creation/activation
  5. Isolated venv (no --system-site-packages; avoids _pynvml_redirector.pth SRE_MAGIC)
  6. CC=$(which gcc) CXX=$(which g++) for UCX configure (conda cross-compiler in PATH)
  7. src/utils/libfabric/ requires hwloc+numa even when LIBFABRIC plugin disabled;
     block via PKG_CONFIG_PATH=$DEPS/lib/pkgconfig:$UCX/lib/pkgconfig (hides cray-libfabric)
  8. hwloc 2.10.0 from source (required but not on system)
  9. CC=$SYS_GCC CXX=$SYS_GXX for NIXL meson (otherwise falls back to /usr/bin/c++ = GCC 7.5.0)
  10. NIXL meson needs -Denable_plugins=UCX,POSIX to skip GDS/Mooncake/LIBFABRIC plugins
  11. Python smoke test || true (UCX segfaults at exit on login node without GPU — expected)

  Network backend (UCX DRAM/VRAM) requires etcd for coordination between two nixlbench instances.
  Phase 2: build grpc + etcd-cpp-api to enable etcd-coordinated UCX benchmarks.

qstat_parsing_note: |
  The bench.sh uses `qstat -x $JOBID | awk 'NR==2{print $5}'` which reads the
  separator line (----), not the data row. Use NR==3 or `qstat -f | grep job_state`
  in future scripts. The poll loop exits when qstat returns empty (job purged from history).
