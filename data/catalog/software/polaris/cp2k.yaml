name: "CP2K"
description: "Quantum chemistry and solid-state physics DFT/MP2/CCSD code (CPU build)"
category: dft
version: "2024.1"

binary: "/eagle/datascience/hzheng/software/polaris/cp2k/bin/cp2k.popt"
install_path: "/eagle/datascience/hzheng/software/polaris/cp2k"

modules: []

setup:
  - "module load PrgEnv-gnu"
  - "module swap gcc-native gcc-native/12.3"
  - "module load cray-mpich"
  - "module load cray-fftw"
  - "module load cray-hdf5"
  - "module load cray-libsci"
  - "export PATH=/eagle/datascience/hzheng/software/polaris/cp2k/bin:$PATH"

gpu_support: false
gpu_notes: "CPU-only build (cp2k.popt). GPU acceleration requires DBCSR with CUDA support (cp2k.psmp with GPU offload); not configured in this build."

run_command: |
  mpiexec -n 16 --ppn 4 cp2k.popt -i input.inp

input_files: [".inp"]

# --- Auto-detection ---
keywords: ["cp2k", "quantum chemistry", "DFT", "density functional theory", "Born-Oppenheimer MD", "AIMD", "Gaussian basis", "plane wave", "GPW", "GAPW", "QM/MM", "periodic DFT", "solid state", "electronic structure"]
aliases: ["cp2k", "cp2k.popt", "cp2k.psmp", "cp2k.sopt"]

input_detection:
  extensions: [".inp"]
  filenames: []
  content_markers: ["&GLOBAL", "&FORCE_EVAL", "&DFT", "&SUBSYS", "METHOD QUICKSTEP", "&CP2K_INPUT"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "4 MPI ranks per node (no GPU). Scale to multiple nodes for large periodic DFT calculations. FFTW and ScaLAPACK from Cray modules. For GPU-accelerated runs, a DBCSR+CUDA build (cp2k.psmp) is required."

# --- Input validation ---
required_inputs: [".inp"]
optional_inputs: [".xyz", ".pdb", ".cell", "BASIS_SET", "POTENTIAL", "*.wfn"]

# --- Output retrieval ---
output_patterns: ["*.out", "*.log", "*.xyz", "*.wfn", "*.cube", "*.pdos", "STRESS*", "FORCE*"]

notes: "Build from source: configure with --with-fftw, --with-libint, --with-libxc, --with-elpa. Use Cray compiler wrappers cc/CC/ftn. GPU build requires DBCSR configured with CUDA."

build_status: "needs_build"
