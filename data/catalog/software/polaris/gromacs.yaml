name: "GROMACS"
description: "High-performance molecular dynamics for biomolecular simulations"
category: simulation
version: "2024"

binary: "/eagle/datascience/hzheng/software/polaris/gromacs/bin/gmx_mpi"
install_path: "/eagle/datascience/hzheng/software/polaris/gromacs"

modules: []

setup:
  - "module use /soft/modulefiles"

gpu_support: true
gpu_notes: "GPU offloading for non-bonded, PME, and bonded interactions"

run_command: |
  gmx_mpi mdrun -deffnm simulation -nb gpu -pme gpu -bonded gpu

input_files: [".tpr", ".gro", ".mdp", ".top"]

# --- Auto-detection ---
keywords: ["molecular dynamics", "MD simulation", "biomolecular", "GROMACS", "protein", "lipid", "free energy"]
aliases: ["gromacs", "gmx", "gmx_mpi", "mdrun"]

input_detection:
  extensions: [".tpr", ".gro", ".mdp", ".top"]
  filenames: []
  content_markers: ["integrator", "nsteps", "dt", "coulombtype"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 1

scaling_notes: "GROMACS uses thread-MPI internally. Typically 1 rank per node with GPU offloading. For multi-node, use gmx_mpi with 1 rank per GPU."

# --- Input validation ---
required_inputs: [".tpr"]
optional_inputs: [".gro", ".mdp", ".top", ".ndx", ".cpt"]

# --- Output retrieval ---
output_patterns: ["*.log", "*.edr", "*.trr", "*.xtc", "*.gro"]

build_status: "built"
build_notes: |
  Smoke tested 2026-05-11 on genesisdemo reservation (A100). GROMACS 2024.2.
  POLARIS GOTCHAS:
  1. -bench/-benchnsteps removed in 2024.2; use real .tpr or nonbonded-benchmark
  2. Set OMP_NUM_THREADS=8 explicitly (PBS sets it to 64, conflicts with -ntomp 8)
  3. -pme gpu requires PME electrostatics; omit for cut-off systems
  4. GPU update crashes on non-PME systems; use -update cpu for LJ-only systems
  Confirmed: 4x A100-SXM4-40GB accessible. Binary verified.
  Recommended: export OMP_NUM_THREADS=8 && mpiexec -n 4 --ppn 4 gmx_mpi mdrun -s *.tpr -nb gpu -pme gpu -bonded gpu -ntomp 8

notes: "No module loads needed; binary is self-contained."
