name: "ESMFold"
description: "Single-sequence protein structure prediction using Meta's ESMFold (esmfold_v1) — fast, no MSA required"
category: ml-framework
version: "v1"

binary: "python"
install_path: "/eagle/datascience/hzheng/venvs/esmfold"

modules: []

setup:
  - "module use /soft/modulefiles"
  - "module load conda"
  - "conda activate base"
  - "source /eagle/datascience/hzheng/venvs/esmfold/bin/activate"
  - "export HF_HOME=/eagle/datascience/hzheng/hf_cache"
  - "export http_proxy=http://proxy.alcf.anl.gov:3128"
  - "export https_proxy=http://proxy.alcf.anl.gov:3128"
  - "export no_proxy=localhost,127.0.0.1,*.alcf.anl.gov"

gpu_support: true
gpu_notes: "Single A100 (40 GB). ~80s model load (cold), ~1 s/peptide for <100 aa. ESM trunk runs fp16, head fp32."

run_command: |
  # The wrapper is NOT deployed to Eagle centrally — bundle it per job from:
  #   jobs/polaris/build_esmfold/infer_wrapper.py
  # Then reference it as $WORKDIR/infer_wrapper.py in run.sh.
  python "$WORKDIR/infer_wrapper.py" \
    --fasta "$WORKDIR/../inputs/input.fasta" \
    --outdir "$WORKDIR/output"

input_files: [".fasta", ".fa", ".faa"]
output_patterns: ["output/*.pdb", "output/results.json"]

keywords: ["esmfold", "esm-fold", "esm fold", "protein folding", "single-sequence folding", "structure prediction"]
aliases: ["esmfold", "esm-fold", "esm_fold"]

input_detection:
  extensions: [".fasta", ".fa", ".faa"]
  content_markers: [">"]

defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  account: "datascience"
  ppn: 1

scaling_notes: "Single-GPU model. To parallelize across many sequences, partition the FASTA and submit one job per chunk; do NOT shard within a single ESMFold call."

required_inputs: [".fasta"]

smoke_command: |
  # Bundle infer_wrapper.py from jobs/polaris/build_esmfold/infer_wrapper.py first
  python "$WORKDIR/infer_wrapper.py" --smoke

build_notes: |
  Created 2026-05-12. Backed by HuggingFace facebook/esmfold_v1, transformers 4.49.0,
  torch 2.8 (cuda 12.4). The venv is created with `--system-site-packages` from the
  Polaris frameworks conda (mconda3 2025-09-25, Python 3.12.11) so torch/cuDNN come
  from the system; only transformers + accelerate + sentencepiece are pip-installed.

  Lessons baked into infer_wrapper.py:
  - `set -eo pipefail` (NEVER -u): conda's deactivate hooks reference unbound vars
    (e.g. CONDA_BACKUP_ADDR2LINE) and will trip nounset.
  - When invoked via IRI/PBS, the script must be called as
    `executable=/bin/bash, arguments=-l,<path>` because Globus strips +x and bare
    `bash <path>` ignores the shebang's `-l`.
  - `out.ptm` from EsmForProteinFolding is a 0-dim tensor on transformers 4.49.x;
    the wrapper uses a shape-agnostic `to_scalar()` helper (was a per-version trap
    in the demo's first cut — `out.ptm[0]` raises IndexError on 0-dim).
  - Per-residue pLDDT comes back as (L, 37) atom-resolved on this version; the
    wrapper averages over the atom axis to produce the standard residue-level value.

build_status: "completed"
build_script: "jobs/polaris/build_esmfold/install.sh"
inference_script: "jobs/polaris/build_esmfold/infer_wrapper.sh"
wrapper_script: "jobs/polaris/build_esmfold/infer_wrapper.py"

stability_metrics:
  primary: "mean_plddt"     # 0–1; >0.7 = high confidence, 0.5–0.7 = moderate, <0.5 = low
  secondary: "ptm"          # 0–1; >0.5 typically indicates a globular fold
  written_to: "output/results.json"
