name: "TensorFlow"
description: "Open-source deep learning framework with GPU acceleration via CUDA"
category: ml-framework
version: "2.15.0"

binary: "python"
install_path: "/soft/applications/conda/2024-04-29/tensorflow"

modules: []

setup:
  - "module load conda"
  - "conda activate /soft/applications/conda/2024-04-29/tensorflow"

gpu_support: true
gpu_notes: "CUDA-enabled; uses all available A100 GPUs via tf.distribute.MirroredStrategy or Horovod."

run_command: |
  python train.py

input_files: [".py"]

# --- Auto-detection ---
keywords: ["tensorflow", "keras", "deep learning", "neural network", "GPU training", "machine learning", "distributed training", "TF2", "Horovod"]
aliases: ["tensorflow", "tf", "keras", "tf2"]

input_detection:
  extensions: [".py"]
  filenames: ["train.py", "main.py"]
  content_markers: ["import tensorflow", "import keras", "tf.keras", "from tensorflow"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "Use tf.distribute.MirroredStrategy for single-node multi-GPU. For multi-node use Horovod with mpiexec. Set TF_GPU_ALLOCATOR=cuda_malloc_async to improve memory efficiency on A100s."

# --- Input validation ---
required_inputs: [".py"]
optional_inputs: ["requirements.txt", "config.yaml"]

# --- Output retrieval ---
output_patterns: ["saved_model/", "*.h5", "*.keras", "checkpoint*", "logs/"]

notes: "ALCF-provided conda env at /soft/applications/conda/2024-04-29/tensorflow. TensorFlow 2.15.0 with CUDA support and cuDNN bundled."

build_status: "installed"
