name: "FLASH"
description: "Adaptive mesh refinement astrophysics simulation code for reactive flows, MHD, and gravity"
category: simulation
version: "4.7"

binary: "/eagle/datascience/hzheng/software/polaris/flash/flash4"
install_path: "/eagle/datascience/hzheng/software/polaris/flash"

modules: []

setup:
  - "module load PrgEnv-gnu"
  - "module swap gcc-native gcc-native/12.3"
  - "module load cray-mpich"
  - "module load cray-hdf5"
  - "export PATH=/eagle/datascience/hzheng/software/polaris/flash:$PATH"

gpu_support: false
gpu_notes: "FLASH4 is CPU-only. GPU offload via OpenACC is experimental in FLASH-X (successor)."

run_command: |
  mpiexec -n 16 --ppn 4 flash4

input_files: ["flash.par"]

# --- Auto-detection ---
keywords: ["flash", "FLASH4", "astrophysics", "adaptive mesh refinement", "AMR", "hydrodynamics", "MHD", "magnetohydrodynamics", "reactive flow", "thermonuclear", "supernova", "combustion", "PARAMESH", "type Ia supernova"]
aliases: ["flash", "flash4", "flash-x", "flashx"]

input_detection:
  extensions: [".par"]
  filenames: ["flash.par", "flash4"]
  content_markers: ["sim_", "geometry", "xl_boundary_type", "lrefine_max", "nend", "dtinit", "basenm"]

# --- Smart defaults ---
defaults:
  nodes: 1
  walltime: 1800
  queue: "debug"
  ppn: 4

scaling_notes: "FLASH uses PARAMESH for AMR across MPI ranks. 4 MPI ranks per node. Scale nodes for larger simulations; memory per rank is the limiting factor. HDF5 parallel I/O used for checkpoint and plot files."

# --- Input validation ---
required_inputs: ["flash.par"]
optional_inputs: ["*.h5", "checkpoint_*"]

# --- Output retrieval ---
output_patterns: ["*_hdf5_chk_*", "*_hdf5_plt_*", "*.log", "*.dat"]

notes: "FLASH requires a per-simulation compile: setup <problem> -auto then make. Build dependencies: HDF5 (parallel), BLAS/LAPACK from cray-libsci. Use Cray wrappers: FC=ftn, CC=cc, CXX=CC. Each simulation problem generates a unique binary."

build_status: "needs_build"
