# ALCF Sophia — 24-node DGX A100 GPU cluster at Argonne National Laboratory

name: "Sophia"
facility: "ALCF"
description: "24-node DGX A100 GPU cluster at Argonne National Laboratory"

software_build_dir: "/eagle/datascience/hzheng/software/sophia"

backend: "alcf_iri"

compute:
  resource_id: "9674c7e1-aecc-4dbb-bf01-c9197e027cd6"
  api_base_url: "https://api.alcf.anl.gov/api/v1"

storage:
  eagle:
    resource_id: "1c3ad9d4-2e91-42bc-becb-72b1fde1235c"
    mount_path: "/eagle"
    remote_base_path: "/datascience/hzheng"
  home:
    resource_id: "6115bd2c-957a-4543-abff-5fae52992ff2"
    mount_path: "/home"

globus:
  eagle:
    endpoint_id: "05d2c76a-e867-4f67-aa57-76edeb0beda0"
    path_prefix: ""
  home:
    endpoint_id: "9032dd3a-e841-4687-a163-2720da731b5b"
    path_prefix: ""
  compute_endpoint_id:
    login: "fad4d968-8c9a-45ce-9fb4-60a9ab90be60"  # sophia multi-user endpoint (identity mapping issue)

clearml:
  queues:
    sophia: "4ee3d5dc8f8640099e3f71a1f2363752"
    sophia-login: "05d81751e2024fc49852ca8d296c5dd9"
    sophia-services: "f95ca3de4d29472fb4c4d506109a74fb"
    sophia-services-executor: "5099b969c7d04f7aa32ed886fa52b894"
    sophia-persistent-compute: "cbafb6cc2b4940779274b01ba093941c"

scheduler:
  # Source: docs.alcf.anl.gov/sophia + ask_alcf (2026-05-09)
  # FIFO scheduling with EASY backfill. Per-project: max 5 running, max 20 queued+running.
  # Walltime limits not officially documented; values below are from experience.
  queues:
    by-gpu:
      min_nodes: 1
      max_nodes: 1           # single node only; request GPUs via select=1:ngpus=N
      min_gpus: 1
      max_gpus: 8            # valid: 1, 2, 4, or 8 GPUs
      min_walltime: 300
      max_walltime: 86400
      per_project_running_limit: 5
      per_project_total_limit: 20
      notes: "Default queue. Targets non-bigmem nodes. Use ngpus=N in select (valid: 1,2,4,8)."
    by-node:
      min_nodes: 1
      max_nodes: 8           # up to 8 full DGX nodes (8 GPUs each)
      min_walltime: 300
      max_walltime: 86400
      per_project_running_limit: 5
      per_project_total_limit: 20
      notes: "Full-node allocation. Each node has 8 A100 40GB GPUs."
    bigmem:
      min_nodes: 1
      max_nodes: 1           # only 2 bigmem nodes total on system
      min_walltime: 300
      max_walltime: 86400
      per_project_running_limit: 5
      per_project_total_limit: 20
      notes: "80GB GPU nodes (2 available). 640GB aggregate GPU memory per node."
    single-gpu:
      routing: true
      notes: "Legacy routing queue → redirects to by-gpu. Use by-gpu for new scripts."
    single-node:
      routing: true
      notes: "Legacy routing queue → redirects to by-node. Use by-node for new scripts."

hardware:
  nodes: 24
  gpus_per_node: 8
  gpu_type: "A100"
  gpu_memory: "40GB"
  nodes_80gb: 2
  cpu: "AMD EPYC 7542 32-Core"
  sockets: 2
  cores_per_socket: 32
  threads_per_node: 128
  memory_per_node: "503GiB"
  os: "RHEL 9.4"

job_defaults:
  shell: "#!/bin/bash -l"
  nodes: 1
  walltime: 300
  queue: "by-gpu"
  account: "datascience"
  custom_attributes:
    filesystems: "home:eagle"
