# OLCF Odo — 30-node AMD MI250X training system at Oak Ridge National Laboratory
# Architecture mirrors Frontier; most Frontier documentation applies.
# Access is via OLCF training events only (XCAMS account + RSA token).
# Login: ssh <xcams_username>@login1.odo.olcf.ornl.gov
#
# ============================================================================
# CRITICAL RULE — read me before writing ANY Odo job script
# ============================================================================
# S3M jobs run as the project service account `csc708_auser`, NOT as `hzheng`.
# To exchange data between hzheng (interactive / odo-services) and S3M jobs,
# all reads and writes MUST go through the shared CSC708 root:
#
#     /gpfs/wolf2/olcf/csc708/proj-shared/s3m/
#       ├── inputs/    hzheng deposits inputs here for S3M to consume
#       ├── outputs/   S3M writes results here for hzheng to read
#       ├── jobs/      per-job working dirs (mkdir under here)
#       ├── logs/      tee'd run logs
#       └── sandbox/   ad-hoc / probes
#
# The directory is mode 2770 (setgid, group csc708, group rwx). Both hzheng
# and csc708_auser are in group csc708, so once you set `umask 002` in the
# script body, every file created under this root is `rw-rw-r-- *:csc708`,
# fully readable + writable by both accounts.
#
# DO NOT write under /ccsopen/home/hzheng (700, csc708_auser cannot enter)
# DO NOT write under /gpfs/wolf2/olcf/csc708/scratch/hzheng (legacy; pre-create
#        per-job dirs with `chmod 2775` if you must use it).
# DO NOT use /ccsopen/proj/csc708 (50 GB quota, already 100 % full).
#
# Verified end-to-end 2026-05-12 (S3M jobs 40262/40263/40264/40265/40266/40267,
# ClearML tasks e7c4469.../12893c1.../79391295.../c86759a3...).
# Full lesson: knowledgebase/hpc/lessons/odo_csc708_shared_fs.md
# ============================================================================

name: "Odo"
facility: "OLCF"
description: "30-node AMD MI250X training system at Oak Ridge National Laboratory (Frontier architecture clone)"

software_build_dir: "/gpfs/wolf2/olcf/csc708/world-shared/hzheng/software"

# Single source of truth for the cross-user shared S3M work area.
# Reference this from job scripts as `$S3M_SHARED` after assignment.
s3m_shared_root: "/gpfs/wolf2/olcf/csc708/proj-shared/s3m"
s3m_shared_subdirs:
  inputs:  "/gpfs/wolf2/olcf/csc708/proj-shared/s3m/inputs"
  outputs: "/gpfs/wolf2/olcf/csc708/proj-shared/s3m/outputs"
  jobs:    "/gpfs/wolf2/olcf/csc708/proj-shared/s3m/jobs"
  logs:    "/gpfs/wolf2/olcf/csc708/proj-shared/s3m/logs"
  sandbox: "/gpfs/wolf2/olcf/csc708/proj-shared/s3m/sandbox"

backend: "slurm"

s3m:
  base_url: "https://s3m.olcf.ornl.gov"   # no /olcf suffix — Slurm paths don't use it
  slurm_resource: "odo"
  slurm_api_version: "v0.0.44"            # odo uses v0.0.44 (Frontier uses v0.0.43)
  # Verified endpoints (2026-05-08):
  #   ping:   GET  /slurm/open/v0.0.44/odo/ping
  #   submit: POST /slurm/open/v0.0.44/odo/job/submit  body: {job:{...}, script:"..."}
  #   status: GET  /slurm/open/v0.0.44/odo/job/{id}    → jobs[0].state.current[0]
  #   list:   GET  /slurm/open/v0.0.44/odo/jobs
  #   cancel: DELETE /slurm/open/v0.0.44/odo/job/{id}
  #   token:  OLCF_S3M_TOKEN from myOLCF → Projects → csc708 → S3M Access → New Token
  # GOTCHAS (2026-05-08):
  #   - S3M submits as service user "csc708_auser"; stdout goes to ccsopen/home/hzheng
  #     but is NOT visible from login node (different filesystem mount on compute).
  #     Use #SBATCH -o /gpfs/wolf2/... to redirect to scratch (compute-mounted).
  #   - signal 53 (SIGRTMIN+19) on batch step is Slurm 25.11.2 cgroup cleanup;
  #     derived_exit_code=SUCCESS/0 means user script ran OK.
  #   - Prefer GCE sbatch (odo-user endpoint f4c25b99) for hzheng-owned jobs
  #     where output must be readable from login node via /ccsopen/home/hzheng.
  # S3M filesystem reality (verified 2026-05-12):
  #   - S3M submits as service user "csc708_auser"; default slurm stdout goes to csc708_auser's
  #     home — NOT accessible by hzheng. ALWAYS set explicit #SBATCH -o/-e.
  #   - SBATCH -o MUST point to /tmp (the SLURM launcher opens the file BEFORE your script's
  #     umask runs, so anywhere except /tmp + the s3m_shared_root subdirs trips perm errors).
  #   - mcp__olcf-s3m__download_file is BROKEN (path→endpoint resolution bug). Read S3M output
  #     either by tee'ing into s3m_shared_root/outputs/ then reading via odo-services queue,
  #     or by Globus from the personal endpoint (3bf1a602-...).
  #
  # Output-retrieval strategy (PREFERRED — verified 2026-05-12):
  #   #SBATCH -o /tmp/<jobname>-%j.out         # SLURM launcher
  #   #SBATCH -e /tmp/<jobname>-%j.err
  #   …
  #   umask 002                                  # CRITICAL — without this, files are rw-r--r--
  #   S3M_SHARED=/gpfs/wolf2/olcf/csc708/proj-shared/s3m
  #   exec > >(tee -a $S3M_SHARED/outputs/<jobname>.${SLURM_JOB_ID}.log) 2>&1
  #
  # Then read back from hzheng via odo-services ClearML queue.
  #
  # Legacy strategies (still functional but discouraged):
  #   - #SBATCH -o /gpfs/wolf2/olcf/csc708/scratch/hzheng/<job>/%j.out
  #     Requires hzheng to pre-create <job>/ as mode 2775; one-job-per-dir.
  #   - /ccsopen/home/hzheng/...  ❌ csc708_auser cannot write there (mode 700).

compute:
  resource_id: ""  # no IRI API for OLCF; use S3M API or direct SSH

storage:
  proj_shared:
    # PREFERRED for S3M ↔ hzheng exchange. Mode 2770 csc708, setgid + group rwx.
    # Use this for ALL S3M reads and writes. Pair with `umask 002` in script body.
    resource_id: ""
    mount_path: "/gpfs/wolf2/olcf"
    remote_base_path: "/csc708/proj-shared/s3m"
    perms: "2770 hzheng:csc708 (setgid, group rwx)"
    cross_user_access: ["hzheng", "csc708_auser"]
    status: "shared"
  scratch:
    resource_id: ""
    mount_path: "/gpfs/wolf2/olcf"
    remote_base_path: "/csc708/scratch/hzheng"
    note: "Per-user subdir (mode 700). Not S3M-accessible without chmod 2775."
  home:
    resource_id: ""
    mount_path: "/ccsopen/home"
    remote_base_path: "/hzheng"
    status: "available"        # verified accessible from both login and compute nodes
    note: "Mode 700 — readable/writable by hzheng only; csc708_auser cannot enter."
  project:
    resource_id: ""
    mount_path: "/ccsopen/proj"
    remote_base_path: "/csc708"
    status: "full"             # 50 GB quota, 100% used as of 2026-05-12 — DO NOT USE

clearml:
  queues:
    odo: "00c1482b820d442781c2e081a59aa72b"
    odo-login: "7ac2691d5da24b3c8b0820098991ad31"
    odo-services: "1a9d739eb12d4411b5568bc09e028b5e"
    odo-services-executor: "bd1107df214c4bc78963cf6cb7153b05"
    odo-persistent-compute: "8be69a6dbb834f5c8a1278e57f9bd0c4"

globus:
  # Endpoint routing for Odo (two-endpoint strategy):
  #   /gpfs/wolf2/...  → odo-personal GCP (3bf1a602-...) — wolf2 is NOT on OLCF standard DTN
  #   /ccs/...         → OLCF standard DTN (36d521b3-...) — standard OLCF home/project FS
  endpoints:
    wolf2: "3bf1a602-4c10-11f1-b0c5-0afffe4617ab"    # odo-personal GCP; serves /gpfs/wolf2/
    ccs:   "36d521b3-c182-4071-b7d5-91db5d380d42"    # OLCF standard DTN; serves /ccs/ (NOT /ccsopen/)
  gcp_endpoint:
    odo-personal: "3bf1a602-4c10-11f1-b0c5-0afffe4617ab"
    # To enable: add /gpfs/wolf2/,0,1 to ~/globusconnectpersonal-3.2.8/config-paths
    # Then restart: ./globusconnectpersonal -stop && ./globusconnectpersonal -start -restrict-paths "rw/gpfs/wolf2/"
    # NOTE: relaytool fails on login node — run GCP from compute node if login setup fails
  compute_endpoints:
    odo-mep: "13781430-e8b8-41a7-bdba-180ec68a194c"      # system-level MEP (OLCF-managed); preferred for GCE jobs

scheduler:
  type: "slurm"
  # Source: OLCF Odo docs are sparse; training system with event-based access (2026-05-09)
  # Architecture mirrors Frontier; Frontier scheduling policies roughly apply.
  queues:
    batch:
      min_nodes: 1
      max_nodes: 30
      min_walltime: 0
      max_walltime: 7200     # training system; shorter limits enforced vs Frontier
      notes: "Primary queue. Access via OLCF training events only."
    gpu:
      min_nodes: 1
      max_nodes: 30
      min_walltime: 0
      max_walltime: 7200
      notes: "Equivalent to batch for GPU jobs; both partitions available on Odo."

# Active Slurm reservations for csc708 (refresh via `scontrol show reservations`).
# Verified 2026-05-12 by submitting probes 40285 (no rsvn → odo05, OUTSIDE) and
# 40286 (job_properties.reservation → odo06, INSIDE).
#
# CRITICAL: S3M's submit_job SILENTLY DROPS `#SBATCH --reservation=...` from the
# script body. To actually use a reservation, you MUST pass it via the Slurm
# REST `job_properties` field on the API call:
#
#   mcp__olcf-s3m__submit_job(
#     system_name="odo",
#     job_properties='{"reservation": "csc708-amsc-2"}',
#     script="#!/bin/bash -l\n#SBATCH -A CSC708 ...",
#   )
#
# Verified: job 40286 landed on odo06 with this approach; job 40285 (with
# `#SBATCH --reservation=csc708-amsc-2` in the body and no job_properties)
# landed on odo05 with SLURM_JOB_RESERVATION=<none>.
reservations:
  csc708-amsc-2:
    nodes: 16
    nodelist: "odo[05-07,10,17-28]"
    partition: "batch"
    project: "csc708"
    start_time: "2026-05-12T05:00:00"
    end_time: "2026-05-14T17:00:00"
    status: "active"
    notes: "AmSC reservation (Anthony, 2026-05-12). Pass via job_properties JSON to submit_job — the script-body #SBATCH directive is dropped by S3M."

hardware:
  nodes: 30               # compute nodes (2 login nodes separate)
  gpus_per_node: 8        # 4 MI250X cards x 2 GCDs each
  gpu_type: "MI250X"
  gcd_hbm_gb: 64          # HBM per GCD
  cpus_per_node: 64       # AMD EPYC "Optimized 3rd Gen" (128 hardware threads)
  cpu_type: "AMD EPYC (Optimized 3rd Gen)"
  memory_per_node_gb: 512

job_defaults:
  shell: "#!/bin/bash -l"   # -l (login shell) required for module/conda commands
  nodes: 1
  walltime: 1800
  queue: "batch"
  account: "csc708"
  reservation: "csc708-amsc-2"   # see `reservations:` block — adds #SBATCH --reservation
  ppn: 8                  # 8 GCDs per node
  umask: "002"            # MUST be set as first body line — ensures group-write on S3M outputs
  stdout_dir: "/tmp"      # SBATCH launcher target only; real outputs go to s3m_shared_root
  stderr_dir: "/tmp"
  body_output_root: "/gpfs/wolf2/olcf/csc708/proj-shared/s3m/outputs"
  body_input_root:  "/gpfs/wolf2/olcf/csc708/proj-shared/s3m/inputs"

# S3M API submit_job canonical template (via olcf-s3m MCP).
