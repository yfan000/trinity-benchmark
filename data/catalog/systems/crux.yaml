# ALCF Crux — 256-node AMD EPYC CPU-only cluster at Argonne National Laboratory

name: "Crux"
facility: "ALCF"
description: "256-node AMD EPYC CPU-only cluster at Argonne National Laboratory"

software_build_dir: "/eagle/datascience/hzheng/software/crux"

backend: "alcf_gc"

compute:
  resource_id: "8b9b42f7-572a-4909-8472-a0453436304c"
  api_base_url: "https://api.alcf.anl.gov/api/v1"

storage:
  eagle:
    resource_id: "1c3ad9d4-2e91-42bc-becb-72b1fde1235c"
    mount_path: "/eagle"
    remote_base_path: "/datascience/hzheng"
  home:
    resource_id: "6115bd2c-957a-4543-abff-5fae52992ff2"
    mount_path: "/home"

globus:
  eagle:
    endpoint_id: "05d2c76a-e867-4f67-aa57-76edeb0beda0"
    path_prefix: ""
  home:
    endpoint_id: "9032dd3a-e841-4687-a163-2720da731b5b"
    path_prefix: ""
  compute_endpoint_id:
    user: "e21502e9-a60c-45dc-b480-6bb5e04789bc"   # single-user (crux-compute)
    mep: "c7ca5e1c-0598-493c-8508-a8725fdbd03d"    # multi-user endpoint (MEP)

clearml:
  queues:
    crux: "6110ef46b61b41d59d45286dacca2e59"
    crux-login: "3e2b686ca373462d82cf5dd024c91860"
    crux-services: "78138d4444834616949af6e89c6f8448"
    crux-services-executor: "64bdbc12b36b404ead5017618bfbfb12"
    crux-persistent-compute: "948d9f1d1583420fb8b9a2b8651a4d78"

scheduler:
  # Source: docs.alcf.anl.gov/crux/running-jobs/ + ask_alcf (2026-05-09)
  queues:
    debug:
      min_nodes: 1
      max_nodes: 8           # 8 exclusive dedicated debug nodes
      min_walltime: 300
      max_walltime: 3600
    workq-route:
      min_nodes: 1
      max_nodes: 184
      min_walltime: 300
      max_walltime: 86400
      routing: true
      per_project_queued_limit: 100
    preemptable:
      min_nodes: 1
      max_nodes: 10
      min_walltime: 300
      max_walltime: 259200   # 72 hours
      per_project_running_limit: 20
      notes: "Jobs killed without warning when demand queue jobs arrive. Use #PBS -r y."
    demand:
      min_nodes: 1
      max_nodes: 64
      min_walltime: 300
      max_walltime: 3600
      notes: "By request only; preempts preemptable queue."

hardware:
  nodes: 256
  gpus_per_node: 0
  gpu_type: ""
  cpus_per_node: 128
  cpu_type: "AMD EPYC 7742 (Rome)"
  memory_per_node_gb: 256

job_defaults:
  shell: "#!/bin/bash -l"
  nodes: 1
  walltime: 600
  queue: "debug"
  account: "datascience"
  ppn: 128
  custom_attributes:
    filesystems: "home:eagle"
